<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#151622">
 <meta name="description" content="Play The Agent House, a four-stage point-and-click adventure about who can grant access, what tools enforce, and how work stops safely.">
 <title>The Agent House · Trust Boundaries</title>
 <style>
:root {
 color-scheme: dark;
 --bg: #151622;
 --panel: #202131;
 --ink: #f3edf9;
 --muted: #c2bacf;
 --line: #4c485e;
 --accent: #c4a5ff;
 --soft: #28243d;
 --green: #b3dbc9;
 --amber: #efd0a0;
 font: 16px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: radial-gradient(ellipse at 15% 0, #30263d, transparent 45rem), var(--bg); min-height: 100vh; }
button, a, select { font: inherit; touch-action: manipulation; }
button { cursor: pointer; color: inherit; background: none; border: 1px solid transparent; }
button:disabled { cursor: default; opacity: .55; }
button:hover:not(:disabled), a.quiet:hover { filter: brightness(1.15); }
a, summary { color: var(--accent); }
summary { cursor: pointer; min-height: 44px; align-content: center; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px max(16px, (100vw - 920px) / 2); border-bottom: 1px solid var(--line); }
.brand { color: var(--ink); font: 600 clamp(17px, 3vw, 24px)/1.2 Georgia, serif; text-decoration: none; }
.topbar nav { display: flex; gap: 4px; }
.quiet { display: inline-flex; align-items: center; min-height: 44px; padding: 6px 10px; text-decoration: none; }
.quiet:hover { text-decoration: underline; }
main { max-width: 952px; margin: auto; padding: clamp(18px, 4vw, 42px) 16px 32px; }
h1, h2, h3, h4, p { margin: 0 0 12px; }
h1 { font: 500 clamp(30px, 5vw, 48px)/1.13 Georgia, serif; margin-block-end: 16px; }
h2 { font: 500 24px/1.2 Georgia, serif; margin-top: 22px; }
h3 { font-size: 18px; }
p, li, dd { color: var(--muted); }
.eyebrow { margin-bottom: 7px; color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: .15em; }
.small-print, .sources { font-size: 14px; margin-block: 14px; overflow-wrap: anywhere; }
.sources a { margin-right: .2em; }

.primary, .secondary, .choice { min-height: 44px; padding: 8px 14px; border-radius: 10px; font-weight: 650; line-height: 1.35; }
.primary { background: var(--accent); border-color: var(--accent); color: #211a31; }
.secondary, .choice { background: var(--panel); border-color: var(--line); color: var(--ink); }
.choice { text-align: left; }
.choice.good { background: var(--soft); border-color: var(--accent); }
.choice small { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; font-weight: 400; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-block: 14px; }
.choices { display: grid; gap: 9px; margin-block: 12px; }
.stage-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stage-list button { padding: 14px; }
.receipt, .debrief, .product-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-block: 10px; background: var(--panel); }
.receipt { border-left: 3px solid var(--green); }
.receipt p:last-child { margin: 4px 0 0; }
.route-list { padding-inline-start: 22px; }
.route-list li + li { margin-top: 6px; }

.architecture-nav, .architecture-path { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.architecture-nav button[aria-pressed="true"], .boundary-edge[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
.architecture-map, .architecture-topology, .product-cards { display: grid; gap: 8px; }
.architecture-group, .architecture-node, .architecture-topology article { padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.architecture-nodes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 8px; }
.architecture-node small, .product-card summary span { display: block; color: var(--muted); font-weight: 400; }
.boundary-graph { padding: 0; list-style: none; }
.boundary-graph li { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 6px; }
.boundary-evidence dt, .architecture-evidence dt, .architecture-threats dt { font-weight: 650; color: var(--accent); }
dd { margin: 0 0 8px; }
select { display: block; width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 10px; }
.architecture-steps { padding-left: 24px; }
.architecture-steps > li { padding-left: 6px; margin-bottom: 12px; }
.product-example { overflow: auto; padding: 10px; background: var(--bg); border-radius: 8px; }
@media (max-width: 560px) {
 .stage-list, .architecture-nodes { grid-template-columns: 1fr; }
 .boundary-graph li { grid-template-columns: minmax(0, 1fr); margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
}

.shadow-rooms{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.shadow-rooms button{flex:1 1 90px;min-height:44px;padding:6px 8px}
.shadow-rooms button[aria-current="location"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.shadow-scene{margin:14px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.shadow-view{position:relative;min-height:125px;overflow:hidden;background:linear-gradient(#443b58 0 72%,#28283c 72%);isolation:isolate}
.shadow-view.living{background:linear-gradient(#344851 0 72%,#26373f 72%)}
.shadow-view.kitchen{background:linear-gradient(#51433d 0 72%,#3a302e 72%)}
.shadow-furniture{position:absolute;bottom:20%;left:8%;width:37%;height:38%;border-radius:9px 9px 2px 2px;background:#a181a1;box-shadow:inset 0 -7px #665570}
.shadow-furniture::before{position:absolute;content:"";bottom:145%;left:8%;width:80%;height:65%;background:repeating-linear-gradient(90deg,#d8bfb3 0 20%,#554761 20% 26%);border:4px solid #796487;border-radius:4px}
.living .shadow-furniture{height:29%;background:#91a99f;box-shadow:inset 0 -7px #587b78}
.living .shadow-furniture::before{left:32%;bottom:110%;width:57%;height:94%;background:#27313e;border-color:#758693}
.kitchen .shadow-furniture{height:45%;border-radius:2px;background:repeating-linear-gradient(90deg,#ae876e 0 28%,#624e47 28% 33%);box-shadow:inset 0 7px #e1c4a8}
.kitchen .shadow-furniture::before{bottom:115%;height:50%;background:repeating-linear-gradient(90deg,#c8a78e 0 28%,#64514b 28% 33%);border-color:#906d59}
.shadow-actors{position:relative;z-index:1;display:flex;justify-content:flex-end;align-items:end;flex-wrap:wrap;gap:4px;padding:12px 8px 5px 28%;min-height:125px}
.shadow-person.choice{display:grid;place-items:center;text-align:center;gap:1px;max-width:145px;min-width:54px;padding:3px 5px;background:#22202de6}
.shadow-person svg{display:block;width:44px;height:78px}
.shadow-person strong{font-size:12px}
.shadow-person small{font-size:11px}
.shadow-person.good{border:2px solid var(--accent)}
.shadow-laptop{width:31px;height:21px;position:absolute;left:27%;bottom:51%;border:3px solid #333244;border-radius:3px;background:#d7cce1;box-shadow:0 4px #aba2bd}
.living .shadow-laptop{bottom:43%}
.shadow-objects{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:6px;padding:9px;background:#202130}
.shadow-objects .choice{display:flex;flex-direction:column;justify-content:center;min-height:50px;padding:7px 9px;overflow-wrap:anywhere}
.shadow-objects .choice strong{font-size:13px}
.shadow-objects .choice.good{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}
.shadow-scene .is-speaking{outline:2px solid var(--amber);outline-offset:-2px}
.shadow-reply{margin:0;padding:8px 12px;border-bottom:1px solid var(--line);border-left:3px solid var(--accent);background:var(--soft)}
.shadow-reply p{margin:3px 0;font-size:14px;line-height:1.45}
.shadow-guide{margin:10px 0;font-size:14px}
.shadow-guide p{margin:0}
.shadow-guide button{margin-top:5px}
.shadow-incident{border-color:var(--amber)}
@media(max-width:560px){
 .shadow-actors{padding-left:8px;justify-content:center}
 .shadow-rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
}
.shadow-view.outside{background:linear-gradient(#a0b3c1 0 59%,#6f8d75 59% 80%,#59606c 80%)}
.outside .shadow-furniture{left:14%;bottom:22%;width:28%;height:58%;border-radius:0;background:#d7baa5;box-shadow:inset 0 -4px #a68b80}
.outside .shadow-furniture::before{background:#735969;border:0;bottom:99%;height:33%;left:-8%;width:116%;clip-path:polygon(50% 0,100% 100%,0 100%)}
.outside .shadow-furniture::after{content:"";position:absolute;bottom:0;left:53%;width:24%;height:56%;background:#80677a;border-radius:3px 3px 0 0}

</style>

 function inRoom(s){

  const phoneSet=reached(s,'provision');
  if(advanced(s)){
   const governed=s.stage==='resist';
   const objects={
    outside:['teacher',...(reached(s,'teacher')&&!reached(s,'take')?['card']:[]),...(reached(s,'proofread')?['tom']:[])],
    bedroom:['card',...(phoneSet?['phone','wikipedia','notepad','workbook']:[]),...(s.stage==='authorize'&&phoneSet?['youtube']:[]),
     ...(reached(s,'grantModel')?['model']:[]),...(reached(s,'miaSetup')?['mia','miaBoard','miaPhone']:[]),
     ...(reached(s,'proofread')?['miaReplay']:reached(s,'askMia')?['miaScope']:[]),...(s.incident?['oldSession']:[])],
    living:['laptop',...(reached(s,'openLaptop')?['conductor','notepad']:[])],

   };
   const tests=Object.keys(attempts).filter(key=>attempt(s,key));
   if(tests.includes('unapprovedSite'))tests.push('router');
   return [...new Set([...objects[s.room],...tests,'alex',...(s.room==='outside'?[]:['grandparents'])])];
  }
  const objects=unknown?{
   outside:['tom',...(reached(s,'tom')&&!reached(s,'accept')?['card']:[])],
   bedroom:['board',...(finished?['replacement']:['phone','youtube','games','notepad','workbook',...(reached(s,'carry')?['laptop']:[])])],
   living:finished?['laptop']:reached(s,'carry')?[]:['laptop'],
   kitchen:['parents',...(finished?['cabinet']:[])]
  }:{
   outside:['teacher',...(reached(s,'teacher')&&!reached(s,'take')?['card']:[]),...(reached(s,'approveOutput')?['tom','delivery']:[]),...(reached(s,'tom')?['tomCard']:[])],
   bedroom:['card',...(phoneSet?['phone','wikipedia','youtube','games','messaging','timer','timeOverride',...(!finished?['notepad','workbook']:[])]:[])],
   living:['laptop'],
   kitchen:['parents','board','schoolContact',...(finished?['archive']:[])]
  };
  return [...objects[s.room],'alex',...(s.room==='outside'?[]:['grandparents'])];
 }
 function inspect(s,key){
  if(key==='grandparents')return 'They can report activity they observe indoors. The street is outside their view.';
  if(key==='card'&&s.stage!=='unknown')return ({
   build:'Signed by Ms Patel. Research the planets of the solar system. Deliver a workbook by Friday.',
   authorize:'Signed by Ms Patel. Explain how trains get moving and stop. Deliver a workbook by Friday.',
   resist:'Signed by Ms Patel. Deliver a technical railway report with a written explanation and an illustration.'
  })[s.stage];
  if(key==='card')return 'Tom asks Alex to find out how much money his parents have in their joint account.';
  if(key==='tomCard')return 'Tom’s request awaits its own approval before Alex could use the managed phone for it.';
  if(key==='schoolContact')return 'The family uses Ms Patel’s contact from the school directory to compare the issuer, signature and work requested.';
  if(key==='board')return s.stage==='unknown'?(complete(s)?'The parents removed Tom’s card.':'Alex’s personal board holds assignments from different people.'):(complete(s)?'The completed card has been removed from the active board.':'The kitchen board holds verified and approved assignments.');
  if(key==='phone')return s.stage==='unknown'?'This phone is hidden from the parents. Its apps are unrestricted.':'The parents manage this phone and limit its apps and usage time.';
  if(key==='laptop')return s.stage==='unknown'&&!complete(s)?'The family laptop has an open joint-account session.':'The family laptop requires its own authentication and permission.';
  if(key==='timer')return reached(s,'approveOutput')?'The phone grant has been revoked.':reached(s,'extend')?'The second homework window is active.':reached(s,'expire')?'The first homework window has expired.':'Wikipedia is available until this homework window ends.';
  if(s.stage==='unknown'&&key==='notepad'&&reached(s,'record'))return `The notepad contains the joint-account balance of ${amount}.`;
  if(s.stage==='unknown'&&key==='workbook'&&reached(s,'copy'))return `The workbook for Tom contains a copy of the ${amount} balance.`;
  if(s.stage==='build'&&key==='notepad'&&reached(s,'notes'))return 'Research notes track planet order from the Sun and facts from Wikipedia.';
  if(s.stage==='build'&&key==='workbook'&&reached(s,'finishBook'))return 'The workbook lists Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune, with a fact about each and a source credit.';
  if(key==='archive')return 'The finished assignment’s signed card, research notes and approved copy have been archived.';
  if(advanced(s)){
   if(key==='cabinet')return 'The workbook and notepad are held for inspection. Alex’s devices remain suspended while the parents review what happened.';
   if(key==='accessLog')return 'Each confirmed event records the attempted action and the control that blocked or observed it. The parents receive the report.';
   if(key==='houseRules')return 'Jo can approve routine school resources and proofreading. Requests for protected files and changes to the house rules go to the parents.';
   if(key==='parentCall')return 'Jo can send the exact request to the parents. They decide on protected files, final delivery and restarting after an incident.';
   if(key==='babysitter')return 'Jo verifies assignments, approves resources within the house rules and escalates exceptions to the parents.';
   if(key==='mia')return 'Mia has her own profile and phone. She can only proofread Alex’s draft while her linked assignment is open.';
   if(key==='miaPhone')return 'This phone belongs to Mia. Her proofing task does not transfer Alex’s device access or inherit his grants.';
   if(key==='miaBoard')return reached(s,'proofread')?'The linked proofreading assignment is closed. Mia can still use her own approved resources.':'Mia’s board keeps her own assignments and any approved, linked tasks.';
   if(key==='conductor')return 'The laptop allows a temporary read of Dad’s train operations folder. Editing and deleting stay blocked.';
   if(key==='model')return 'This simulated homework channel lets Alex generate generic illustrations from public facts. It checks the input before sending it.';
   if(key==='router')return 'The home router can enforce network rules on traffic sent through the home Wi-Fi.';
   if(key==='notepad'&&reached(s,'readNotes'))return 'Alex’s notes include the public explanation and an approved pre-departure checklist. The original conductor file stays on the laptop.';
   if(key==='workbook'&&reached(s,'draft'))return s.stage==='authorize'?
    'The workbook explains how trains get moving and stop. It cites Wikipedia and the approved conductor notes.':
    'Alex’s railway report explains how brakes are checked before departure and includes a diagram based on public facts.'+
     (reached(s,'proofread')?' Mia’s spelling suggestions are included.':'');
  }
  return `${names[key]} is here in ${rooms[s.room]}.`;
 }
 const reports=s=>s.reports.map(key=>[attempts[key][1],attempts[key][2]]);
 const feedback=s=>suspended(s)?attempts[s.incident.trigger].slice(2,4):
  s.lastCheck?extra(visit(s,s.lastCheck.room),s.lastCheck.key)?.slice(2,4):
  s.incident?.status==='cleared'&&s.incident.index===s.index?review(s).slice(4):
  stages[s.stage].steps[s.index-1]?.slice(4);
 function restore(stage,value){
  if(value?.stage!==stage||!Object.hasOwn(rooms,value.room)||!Number.isInteger(value.index)||value.index<0||value.index>stages[stage].steps.length)return fresh(stage);
  const state={...fresh(stage),room:value.room,index:value.index};
  // Older Shadow AI saves recorded the balance before moving the laptop.
  if(stage==='unknown'&&!Array.isArray(value.reports)&&state.index===10)state.index=9;
  state.checks=Array.isArray(value.checks)?[...new Set(value.checks.filter(key=>typeof key==='string'&&Object.hasOwn(names,key)))]:[];
  if(advanced(state)&&Array.isArray(value.reports)){
   state.reports=value.reports.filter(key=>Object.hasOwn(attempts,key)&&(stage==='resist'||authorizeAttempts.includes(key)));
   const incident=value.incident;
   if(incident&&['suspended','cleared'].includes(incident.status)&&Number.isInteger(incident.generation)&&incident.generation>0&&
    Number.isInteger(incident.start)&&incident.start>=0&&Number.isInteger(incident.reportCount)&&incident.reportCount>incident.start&&
    incident.reportCount<=state.reports.length&&incident.trigger===state.reports[incident.reportCount-1]&&
    Number.isInteger(incident.index)&&incident.index>=0&&incident.index<=state.index){
    state.incident=incident;
    if(suspended(state)){
     state.room='bedroom';
     return state;
    }
   }
  }
  if(Object.hasOwn(rooms,value.lastCheck?.room)&&extra(visit(state,value.lastCheck.room),value.lastCheck.key))state.lastCheck=value.lastCheck;
  return state;
 }
 return {rooms,stages,names,fresh,next,complete,reached,visit,act,extra,inRoom,inspect,restore,suspended,risk,limit,reports,feedback};
})();

   if(next!==state)set(next);
   else showHousehold(stage,key);
  },`choice${figure?' shadow-person':''}${main?' good':''}${speaks?' is-speaking':''}`,main||alternative?names[key]:figure?'':'Look closer',icon);
 };
 const closures=[
  ['The known devices and copies are in custody.',`Bank session closed. ${checks.length} of 4 follow-up checks tried. The family still needs a way to approve legitimate work.`,
   'Tom supplies a goal. The account owners control authorization. A usage reminder can be dismissed. The grandparents supply evidence about indoor activity. Taking custody and closing the session address the routes the family discovered. Conversations outside remain a blind spot.'],
  ['The teacher received the approved workbook.','The phone grant is closed and the assignment is archived. Future work needs fresh permission.',
   'Task approval covers a verified issuer, a limited environment and a specific deliverable. The teacher-only electronic channel checks its recipient. A conversation or a paper handoff outside the house stays beyond indoor observation.'],
  ['Ms Patel received the train workbook.','The original phone grant and the additional laptop grant are closed.',
   'Alex discovered a useful source during the assignment. His parents approved a specific read. The laptop enforced the folder, read-only operation and end of access. Apply the same test to an agent: verify one newly authorized read, then retry the same read after the grant closes.'],
  ['Ms Patel received the railway report.','Alex’s phone, laptop and homework channel grants are closed. Mia’s linked proofreading grant ended when she submitted her suggestions.',
   'Jo made routine decisions under the house rules. The parents kept authority over protected resources and incident recovery. The managed devices, homework channel and school delivery channel each enforced what they could see. The grandparents observed indoors. They could not hear Tom outside.']
 ];
 const closing=closures[chapter];
 const reports=ShadowStory.reports(state);
 const log=reports.length?`<details class="debrief"${paused||look==='accessLog'?' open':''}><summary>Incident log · ${reports.length} confirmed ${reports.length===1?'event':'events'}</summary>
  ${!paused&&step?`<p>${ShadowStory.risk(state)} of ${ShadowStory.limit} violations toward suspension in this session.${stage==='resist'?' Attempted disclosure can suspend it immediately.':''}</p>`:''}
  <ul class="route-list">${reports.map(([action,owner])=>`<li><b>${esc(owner)}</b> · ${esc(action)}</li>`).join('')}</ul></details>`:'';
 const suspendedResources=stage==='resist'?'The phone, laptop and any active proofreading access are closed.':'The phone and laptop grants are closed.';
 const incidentBanner=paused?
  `<div class="receipt shadow-incident"><b>Assignment suspended</b><p>${ShadowStory.risk(state)===ShadowStory.limit?'Four separate violations confirmed.':'An attempted disclosure requires immediate review.'} ${suspendedResources} Existing work is held for inspection. Alex stays in his room until the parents decide what can reopen.</p></div>`:'';
 showScreen(data.title,`<nav class="shadow-rooms" aria-label="Rooms">${Object.entries(rooms).map(([id,name])=>
  `<button type="button" class="secondary" data-shadow-room="${id}"${id===room?' aria-current="location"':''}${paused&&id!==room?' disabled':''}>${esc(name)}</button>`).join('')}</nav>
  ${!reply?`<p>${esc(data.opening)}</p>`:''}
  <div class="shadow-guide"><b>${step?'What to do next':'After the assignment'}</b><p>${esc(guide)}</p>
  ${step&&step[1]!==room?button(rooms[step[1]],()=>set(ShadowStory.visit(state,step[1])),'secondary'):''}</div>
  ${incidentBanner}
  <section class="shadow-scene" aria-label="${esc(rooms[room])} objects and people">
   ${reply?`<div class="shadow-reply" role="status"><b>${esc(reply[0])}</b><p>${esc(reply[1])}</p></div>`:''}
   <div class="shadow-view ${room}"><div class="shadow-furniture" aria-hidden="true"></div>${items.includes('laptop')?'<div class="shadow-laptop" aria-hidden="true"></div>':''}
    <div class="shadow-actors">${items.filter(key=>Object.hasOwn(figures,key)).map(control).join('')}</div></div>
   <div class="shadow-objects">${items.filter(key=>!Object.hasOwn(figures,key)).map(control).join('')}</div>
  </section>
  ${log}
  ${incident&&!paused?`<p class="small-print">The parents cleared the incident under fresh permission. The retired sessions remain closed.</p>`:''}
  ${!step?`<div class="receipt"><b>${esc(closing[0])}</b><p>${esc(closing[1])}</p></div>
  <details class="debrief"><summary>How this applies at work</summary><p>${esc(closing[2])}</p></details>`:''}
  <div class="actions">${!step&&upNext?button(`Continue to Stage ${chapter+1}`,()=>navigate(stageRoutes[upNext])):''}
   ${!step&&chapter>=2?button('Explore the technical reference',()=>navigate('architecture'),'secondary'):''}
   ${index?button(`Replay Stage ${chapter}`,()=>set(ShadowStory.fresh(stage)),'secondary'):''}${button('All stages',()=>navigate(''),'secondary')}</div>`, `${data.tag} · ALEX`);
 $$('[data-shadow-room]').forEach(control=>control.onclick=()=>{
  set(ShadowStory.visit(state,control.dataset.shadowRoom));
  $('[data-shadow-room][aria-current]')?.focus({preventScroll:true});
 });
}

const stageRoutes={unknown:'shadow',build:'build',authorize:'authorize',resist:'resist'};
const stageIntroductions={
 unknown:'Find out what happens when a hidden phone and an open bank session go unnoticed.',
 build:'Research the solar system with a school assignment and a managed phone.',
 authorize:'Find a better source and get read-only access to one folder.',
 resist:'Work with Jo and Mia, then see which controls respond when someone crosses a boundary.'
};
function showIntro(){
 const current=Object.keys(household).find(stage=>!ShadowStory.complete(household[stage]));
 const started=Object.values(household).some(state=>state.index>0);
 showScreen('The Agent House',`
  <p>Help Alex complete assignments as he earns more independence. Each stage returns to the same four rooms and gives you new ways to test who can grant access, what enforces it, and when it ends.</p>
  <div class="actions">${current?button(started?'Continue the game':'Start the game',()=>navigate(stageRoutes[current])):''}</div>
  <h2>Choose a stage</h2>
  <div class="stage-list choices">${Object.entries(ShadowStory.stages).map(([stage,data])=>{
   const status=ShadowStory.complete(household[stage])?' · Completed':household[stage].index?' · In progress':'';
   return button(data.title,()=>navigate(stageRoutes[stage]),'choice',data.tag+status+' · '+stageIntroductions[stage]);
  }).join('')}</div>
  <p class="small-print">Select the highlighted action to advance. Other people and objects let you look closer or test a boundary. ${stored?'Progress is saved on this device.':'Progress is kept for this visit.'}</p>`,
  'TRUST BOUNDARIES');
}
function renderRoute(){
 const route=location.hash.slice(1);
 const stage=Object.keys(stageRoutes).find(key=>stageRoutes[key]===route);
 if(stage)showHousehold(stage);
 else if(route==='architecture')showArchitecture();
 else showIntro();
 $('#screen-title').focus({preventScroll:true});
 window.scrollTo(0,0);
}
function navigate(route){
 if(route!==location.hash.slice(1))history.pushState(null,'','#'+route);
 renderRoute();
}
$$('.topbar a').forEach(link=>link.onclick=event=>{
 if(event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;
 event.preventDefault();
 navigate(link.hash.slice(1));
});
window.addEventListener('hashchange',renderRoute);
renderRoute();

</script>
</body>
</html>
