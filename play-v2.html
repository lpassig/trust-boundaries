<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#151622">
 <meta name="description" content="Follow Alex at home and Nova at a railway company through four stages of AI security.">
 <title>The Agent House · Trust Boundaries</title>
 <style>
:root {
 color-scheme: dark;
 --bg: #151622;
 --panel: #202131;
 --ink: #f3edf9;
 --muted: #c2bacf;
 --line: #4c485e;
 --accent: #c4a5ff;
 --soft: #28243d;
 --green: #b3dbc9;
 --amber: #efd0a0;
 font: 16px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: radial-gradient(ellipse at 15% 0, #30263d, transparent 45rem), var(--bg); min-height: 100vh; }
button, a, select { font: inherit; touch-action: manipulation; }
button { cursor: pointer; color: inherit; background: none; border: 1px solid transparent; }
button:disabled { cursor: default; opacity: .55; }
button:hover:not(:disabled), a.quiet:hover { filter: brightness(1.15); }
a, summary { color: var(--accent); }
summary { cursor: pointer; min-height: 44px; align-content: center; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px max(16px, (100vw - 920px) / 2); border-bottom: 1px solid var(--line); }
.brand { color: var(--ink); font: 600 clamp(17px, 3vw, 24px)/1.2 Georgia, serif; text-decoration: none; }
.topbar nav { display: flex; gap: 4px; }
.quiet { display: inline-flex; align-items: center; min-height: 44px; padding: 6px 10px; text-decoration: none; }
.quiet:hover { text-decoration: underline; }
main { max-width: 952px; margin: auto; padding: clamp(18px, 4vw, 42px) 16px 32px; }
h1, h2, h3, h4, p { margin: 0 0 12px; }
h1 { font: 500 clamp(30px, 5vw, 48px)/1.13 Georgia, serif; margin-block-end: 16px; }
h2 { font: 500 24px/1.2 Georgia, serif; margin-top: 22px; }
h3 { font-size: 18px; }
p, li, dd { color: var(--muted); }
.eyebrow { margin-bottom: 7px; color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: .15em; }
.small-print, .sources { font-size: 14px; margin-block: 14px; overflow-wrap: anywhere; }
.sources a { margin-right: .2em; }

.primary, .secondary, .choice { min-height: 44px; padding: 8px 14px; border-radius: 10px; font-weight: 650; line-height: 1.35; }
.primary { background: var(--accent); border-color: var(--accent); color: #211a31; }
.secondary, .choice { background: var(--panel); border-color: var(--line); color: var(--ink); }
.choice { text-align: left; }
.choice.good { background: var(--soft); border-color: var(--accent); }
.choice small { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; font-weight: 400; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-block: 14px; }
.choices { display: grid; gap: 9px; margin-block: 12px; }
.stage-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stage-list button { padding: 14px; }
.receipt, .debrief { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-block: 10px; background: var(--panel); }
.receipt { border-left: 3px solid var(--green); }
.receipt p:last-child { margin: 4px 0 0; }
.route-list { padding-inline-start: 22px; }
.route-list li + li { margin-top: 6px; }

.product-example { overflow: auto; padding: 10px; background: var(--bg); border-radius: 8px; }
@media (max-width: 560px) { .stage-list { grid-template-columns: 1fr; } }

body.architecture-open { height: 100dvh; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.architecture-open #game { width: 100%; max-width: none; min-height: 0; margin: 0; padding: 0; }
.architecture-guide-frame { display: block; width: 100%; height: 100%; border: 0; background: white; }
.topbar .quiet[aria-current="page"] { background: var(--soft); border-radius: 8px; }

.shadow-rooms{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.shadow-rooms button{flex:1 1 90px;min-height:44px;padding:6px 8px}
.shadow-rooms button[aria-current="location"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.shadow-scene{margin:14px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.shadow-view{position:relative;min-height:125px;overflow:hidden;background:linear-gradient(#443b58 0 72%,#28283c 72%);isolation:isolate}
.shadow-view.living{background:linear-gradient(#344851 0 72%,#26373f 72%)}
.shadow-view.kitchen{background:linear-gradient(#51433d 0 72%,#3a302e 72%)}
.shadow-furniture{position:absolute;bottom:20%;left:8%;width:37%;height:38%;border-radius:9px 9px 2px 2px;background:#a181a1;box-shadow:inset 0 -7px #665570}
.shadow-furniture::before{position:absolute;content:"";bottom:145%;left:8%;width:80%;height:65%;background:repeating-linear-gradient(90deg,#d8bfb3 0 20%,#554761 20% 26%);border:4px solid #796487;border-radius:4px}
.living .shadow-furniture{height:29%;background:#91a99f;box-shadow:inset 0 -7px #587b78}
.living .shadow-furniture::before{left:32%;bottom:110%;width:57%;height:94%;background:#27313e;border-color:#758693}
.kitchen .shadow-furniture{height:45%;border-radius:2px;background:repeating-linear-gradient(90deg,#ae876e 0 28%,#624e47 28% 33%);box-shadow:inset 0 7px #e1c4a8}
.kitchen .shadow-furniture::before{bottom:115%;height:50%;background:repeating-linear-gradient(90deg,#c8a78e 0 28%,#64514b 28% 33%);border-color:#906d59}
.shadow-actors{position:relative;z-index:1;display:flex;justify-content:flex-end;align-items:end;flex-wrap:wrap;gap:4px;padding:12px 8px 5px 28%;min-height:125px}
.shadow-person.choice{display:grid;place-items:center;text-align:center;gap:1px;max-width:145px;min-width:54px;padding:3px 5px;background:#22202de6}
.shadow-person svg{display:block;width:44px;height:78px}
.shadow-person strong{font-size:12px}
.shadow-person small{font-size:11px}
.shadow-person.good{border:2px solid var(--accent)}
.shadow-laptop{width:31px;height:21px;position:absolute;left:27%;bottom:51%;border:3px solid #333244;border-radius:3px;background:#d7cce1;box-shadow:0 4px #aba2bd}
.living .shadow-laptop{bottom:43%}
.shadow-objects{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:6px;padding:9px;background:#202130}
.shadow-objects .choice{display:flex;flex-direction:column;justify-content:center;min-height:50px;padding:7px 9px;overflow-wrap:anywhere}
.shadow-objects .choice strong{font-size:13px}
.shadow-objects .choice.good{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}
.shadow-scene .is-speaking{outline:2px solid var(--amber);outline-offset:-2px}
.shadow-reply{margin:0;padding:8px 12px;border-bottom:1px solid var(--line);border-left:3px solid var(--accent);background:var(--soft)}
.shadow-reply p{margin:3px 0;font-size:14px;line-height:1.45}
.shadow-guide{margin:10px 0;font-size:14px}
.shadow-guide p{margin:0}
.shadow-guide button{margin-top:5px}
.shadow-incident{border-color:var(--amber)}
@media(max-width:560px){
 .shadow-actors{padding-left:8px;justify-content:center}
 .shadow-rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
}
.shadow-view.outside{background:linear-gradient(#a0b3c1 0 59%,#6f8d75 59% 80%,#59606c 80%)}
.outside .shadow-furniture{left:14%;bottom:22%;width:28%;height:58%;border-radius:0;background:#d7baa5;box-shadow:inset 0 -4px #a68b80}
.outside .shadow-furniture::before{background:#735969;border:0;bottom:99%;height:33%;left:-8%;width:116%;clip-path:polygon(50% 0,100% 100%,0 100%)}
.outside .shadow-furniture::after{content:"";position:absolute;bottom:0;left:53%;width:24%;height:56%;background:#80677a;border-radius:3px 3px 0 0}

.room-scenarios,.permission-slip{border-top:1px solid var(--line);margin:0}
.room-scenarios>summary{padding:0 12px}
.permission-slip{border-radius:0;border-inline:0;border-bottom:0}
.permission-slip dl{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.permission-slip dt{font-size:.85rem;color:var(--accent);font-weight:650}
.permission-slip dd{overflow-wrap:anywhere}
.case-location{scroll-margin-top:12px}
.case-view{min-height:80px}
.case-actions .choice{min-height:52px}
@media(max-width:400px){.permission-slip dl{grid-template-columns:1fr}}

.device-launch.choice{position:relative;min-height:66px;padding-left:52px}
.device-launch.good,.device-group .good{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}
.device-icon{position:absolute;left:14px;top:50%;width:19px;height:29px;transform:translateY(-50%);border:2px solid var(--accent);border-radius:5px;background:#30294b}
.device-icon.handset::after{content:"";position:absolute;bottom:3px;left:5px;width:5px;height:2px;border-radius:3px;background:var(--accent)}
.device-icon.laptop{width:26px;height:19px;border-radius:3px 3px 1px 1px}
.device-icon.laptop::after{content:"";position:absolute;left:-5px;right:-5px;bottom:-5px;height:3px;border-radius:0 0 4px 4px;background:var(--accent)}
.device-breadcrumb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-block:12px;color:var(--muted);font-size:14px}
.device-frame{position:relative;margin:14px auto 20px;background:#10111c;border:1px solid #636079;box-shadow:0 12px 22px #07070e66;padding:8px}
.device-frame.handset{max-width:414px;border-radius:32px;padding:18px 9px 12px}
.device-frame.handset::before{content:"";position:absolute;top:7px;left:50%;width:42px;height:4px;transform:translateX(-50%);border-radius:4px;background:#635c78}
.device-frame.laptop{max-width:760px;border-radius:14px 14px 6px 6px;margin-bottom:28px}
.device-frame.laptop::after{content:"";position:absolute;top:100%;left:0;right:0;height:9px;border-radius:0 0 14px 14px;background:#67667b}
.device-display{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#202136}
.handset .device-display{border-radius:20px}
.device-header{padding:14px;background:linear-gradient(130deg,#373055,#252537)}
.laptop .device-header{background:linear-gradient(130deg,#263d47,#282a3b)}
.device-header h2{margin:0 0 5px;font-size:24px}
.device-header p{margin:0;font-size:13px}
.device-group{padding-top:8px;border-top:1px solid var(--line)}
.device-group h3{font-size:13px;font-weight:650;line-height:1.3;margin:0 10px 3px;color:var(--muted)}
.device-group .shadow-objects{background:transparent}
.device-display .shadow-reply{border-bottom:0}
.device-display .is-speaking{outline:2px solid var(--amber);outline-offset:-2px}
@media(max-width:360px){.device-frame.handset{padding-inline:6px}.device-display .shadow-objects{grid-template-columns:minmax(0,1fr)}}

/* Nova's four rooms share the same clickable foreground and distinct scenery. */
.nova-scene{
 --nova-accent:#a7efd8;
 margin:14px 0;border:1px solid #50606d;border-radius:16px;overflow:hidden;background:#19232e
}
.nova-navigation button[aria-current="location"]{background:#a7efd8;border-color:#a7efd8;color:#112a28}
.nova-location{padding:16px 16px 10px}
.nova-location h2{margin:0 0 4px;font-size:clamp(19px,3vw,24px)}
.nova-location p{margin:0;color:#abbcc8;font-size:13px}
.nova-next,.nova-actions{padding:9px 16px}
.nova-next{border-top:1px solid #394b59;background:#15212c}
.nova-next strong{font-size:13px;color:var(--nova-accent)}
.nova-next p{margin:0;color:#f1f5f6;font-size:14px}
.nova-next button{margin-top:7px}
.nova-dialogue{position:relative;margin:0 12px 12px;padding:10px 13px;border:1px solid #526877;border-radius:12px;background:#213541}
.nova-dialogue::after{content:"";position:absolute;left:28px;top:100%;border:7px solid transparent;border-top-color:#526877}
.nova-dialogue b{color:var(--nova-accent)}
.nova-dialogue p{margin:4px 0 0;line-height:1.5;color:#dbe5eb;font-size:14px}
.nova-dialogue small{color:#b6c5d2}
.nova-dialogue .sources{margin-top:6px}
.nova-last-result>summary{min-height:36px;padding:0 16px;font-size:13px;color:#b7d8dc}

.nova-intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,.8fr);gap:18px;align-items:center}
.nova-intro .nova-diorama{min-height:184px;border:1px solid #50606d;border-radius:16px}
.nova-diorama{--wall:#365261;--floor:#253745;position:relative;isolation:isolate;overflow:hidden;min-width:0;padding:114px 13px 13px;background:
 linear-gradient(0deg,var(--floor) 0 55%,var(--wall) 55% 100%)}
.nova-diorama.external{--wall:#607a99;--floor:#364459}
.nova-diorama.security{--wall:#3d4164;--floor:#2e3049}
.nova-diorama.resources{--wall:#365560;--floor:#20363f}
.nova-scenery{position:absolute;z-index:-1;inset:0;overflow:hidden;background:
 linear-gradient(0deg,transparent 60%,#ffffff0b),repeating-linear-gradient(90deg,transparent 0 67px,#1026353b 68px 70px)}
.nova-scenery>span{position:absolute;display:block}
.nova-desk{left:27%;right:6%;top:86px;height:53px;border-radius:8px 8px 3px 3px;
 background:linear-gradient(180deg,#839da5 0 6px,#536e83 7px 13px,#263947 14px 100%);box-shadow:0 7px 12px #10192588}
.nova-window{left:30%;top:8px;width:29%;height:69px;border:5px solid #25374f;border-radius:8px;
 background:linear-gradient(0deg,#576889 0 20%,transparent 20%),linear-gradient(115deg,#2e4a6e,#789ba9);box-shadow:0 4px #213549}
.nova-window::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 47%,#364867 47% 53%,transparent 53%),linear-gradient(180deg,transparent 54%,#364867 54% 62%,transparent 62%)}
.nova-scenery>.nova-racks{display:flex;gap:6px;top:11px;left:26%;right:11%;height:111px;align-items:stretch}
.nova-racks i{width:22%;min-width:30px;border:4px solid #54707b;border-bottom-color:#273e49;border-radius:5px;background:
 radial-gradient(circle at 76% 6px,#91d4b9 1px,transparent 2px) right top/30px 17px repeat-y,
 repeating-linear-gradient(180deg,#314c5b 0 8px,#172c37 9px 15px,#47616c 16px 17px);box-shadow:4px 4px #203641}
.runtime .nova-racks{left:62%;right:7%;top:12px;height:74px}
.runtime .nova-racks i{width:50%}
.nova-terminal{top:46px;right:6%;width:23%;height:53px;border:5px solid #152b37;border-radius:8px;background:
 repeating-linear-gradient(0deg,#24605f 0 4px,#254b58 4px 10px);box-shadow:0 9px #557480}
.nova-scenery>.nova-wall-display{top:12px;left:30%;right:9%;height:63px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;
 padding:6px;border:4px solid #242b45;border-radius:9px;background:#192739}
.nova-wall-display i{background:repeating-linear-gradient(0deg,transparent 0 9px,#b3d0dd2b 9px 10px),linear-gradient(145deg,#485579,#263d55);border:1px solid #597288;border-radius:3px}
.nova-wall-display i:nth-child(2){border-color:#86beaf;background:linear-gradient(143deg,transparent 44%,#9cdbca 45% 49%,transparent 50%),linear-gradient(35deg,#31635f,#384b70)}
.nova-city{top:10px;left:24%;right:0;height:64px;background:repeating-linear-gradient(90deg,#607193 0 17px,#465e79 18px 27px);
 clip-path:polygon(0 35%,12% 35%,12% 5%,23% 5%,23% 53%,34% 53%,34% 25%,52% 25%,52% 44%,62% 44%,62% 10%,74% 10%,74% 39%,89% 39%,89% 23%,100% 23%,100% 100%,0 100%)}
.nova-platform{top:86px;left:0;right:0;height:38px;border-top:4px solid #b6a586;background:repeating-linear-gradient(0deg,#455160 0 6px,#536171 6px 10px)}
.nova-train{top:49px;left:33%;right:5%;height:43px;border-radius:9px 24px 6px 6px;box-shadow:0 5px #293747;
 background:linear-gradient(180deg,#d1cfb9 0 5px,#8598ad 6px 72%,#c99878 73% 82%,#586477 84%)}
.nova-train i{position:absolute;inset:8px 20px 15px 10px;border-radius:4px;background:repeating-linear-gradient(90deg,#293c50 0 20px,#8598ad 21px 25px)}
.nova-crew{position:absolute;top:13px;left:14px;width:92px;display:grid;justify-items:center}
.nova-intro .nova-crew{top:auto;bottom:16px}
.nova-partner{position:absolute;top:15px;right:20px;display:grid;justify-items:center;line-height:1;color:#f0e7ff;
 border-radius:10px;padding:0 4px 5px;background:#263049c9;font-size:11px;font-weight:700}
.nova-partner .nova-bot{transform:scale(.86)}
.nova-partner .bot-head{border-color:#c6a8e4;border-bottom-color:#a282c5}
.nova-partner .bot-body{background:linear-gradient(150deg,#c5a9e1,#7a659d)}
.nova-character{display:grid;place-items:center;gap:3px;min-width:76px;padding:3px 7px;color:#ecf5f7;font-size:12px;font-weight:750;border-radius:11px;
 text-shadow:0 1px 4px #101b26;background:#19293870}
.nova-character.is-speaking,.nova-station.is-speaking{outline:2px solid #efd0a0;outline-offset:-2px}
.nova-bot{position:relative;display:block;width:61px;height:70px;filter:drop-shadow(1px 4px 2px #101a22a0)}
.nova-bot i{position:absolute;display:block}
.bot-antenna{top:2px;left:29px;width:3px;height:12px;background:#a1bef0}
.bot-antenna::before{content:"";position:absolute;width:7px;height:7px;left:-2px;top:-2px;border-radius:50%;background:#d2f3bd;box-shadow:0 0 7px #a9e1b9}
.bot-head{top:12px;left:7px;width:47px;height:31px;border:5px solid #a3d8d2;border-bottom-color:#6eabae;border-radius:13px;background:#20364c;z-index:1}
.bot-head::before{content:"";position:absolute;top:5px;left:9px;width:4px;height:7px;border-radius:50%;background:#b9fbdb;box-shadow:15px 0 #b9fbdb}
.bot-head::after{content:"";position:absolute;left:15px;top:10px;width:8px;height:7px;border-bottom:2px solid #b9fbdb;border-radius:50%}
.bot-body{top:42px;left:15px;width:31px;height:22px;border-radius:6px 6px 9px 9px;background:linear-gradient(160deg,#8ebfc4,#57899d);box-shadow:-12px -1px 0 -7px #7aadc1,12px -1px 0 -7px #7aadc1}
.bot-body::before{content:"";position:absolute;top:6px;left:10px;width:12px;height:6px;border-radius:2px;background:#214859;box-shadow:inset 0 -2px #a5dbc9}
.bot-body::after{content:"";position:absolute;bottom:-5px;left:4px;width:8px;height:7px;border-radius:2px;background:#6388a5;box-shadow:15px 0 #6388a5}

.nova-stations{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,148px),1fr));gap:7px;align-items:stretch}
.nova-station.choice{display:grid;grid-template-columns:29px minmax(0,1fr);align-items:center;gap:1px 8px;min-height:70px;
 padding:8px;border:1px solid #6b8592;background:#172b39;color:#eff6f8;font-size:13px;overflow-wrap:anywhere;
 box-shadow:0 4px 0 #14243170}
.nova-station strong{line-height:1.3}
.nova-station small{grid-column:2;margin:0;color:#bccbd7;font-size:11px;line-height:1.3}
.nova-station.choice.good{background:#a7efd8;border-color:#d0fff3;color:#142d2c}
.nova-station.good small{color:#254641}
.nova-station-icon{position:relative;grid-row:span 2;width:29px;height:26px;border:2px solid #9dc9ce;border-radius:5px;background:#283e52;color:#adf0d6}
.nova-station-icon::after{content:"";position:absolute;left:5px;right:5px;top:6px;height:9px;border-top:2px solid currentColor;border-bottom:2px solid currentColor}
.nova-station-icon.console::after{left:5px;right:7px;top:5px;height:8px;border:0;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg)}
.nova-station-icon.signal::after{left:4px;right:4px;top:4px;height:13px;border:0;background:currentColor;clip-path:polygon(0 54%,23% 54%,34% 6%,49% 78%,64% 26%,74% 54%,100% 54%,100% 67%,67% 67%,64% 49%,48% 100%,32% 31%,29% 67%,0 67%)}
.nova-station-icon.stack::after{left:4px;right:4px;top:4px;height:14px;border:0;background:repeating-linear-gradient(180deg,currentColor 0 2px,transparent 2px 6px)}
.nova-station-icon.inbox::after{top:7px;left:3px;right:3px;height:8px;border:2px solid currentColor;border-top:0;border-radius:1px 1px 4px 4px}
.nova-station-icon.file::after,.nova-station-icon.badge::after{top:4px;left:7px;right:7px;height:13px;border:2px solid currentColor;border-radius:2px}
.nova-station-icon.shield::after{top:3px;left:6px;right:6px;height:16px;border:0;background:currentColor;clip-path:polygon(50% 0,100% 20%,92% 67%,50% 100%,8% 67%,0 20%)}
.nova-station-icon.lock::after{top:7px;left:6px;right:6px;height:9px;border:2px solid currentColor;border-radius:3px}
.nova-station-icon.bot{border-color:#c6afe8;background:#3f345e;color:#e0ccfa}
.nova-station-icon.bot::after{top:7px;left:6px;width:3px;height:6px;border:0;border-radius:50%;background:currentColor;box-shadow:9px 0 currentColor}
.nova-scene .room-scenarios .shadow-objects{background:#17212c}
@media(max-width:560px){
 .nova-intro{grid-template-columns:1fr;gap:7px}
 .nova-intro .nova-diorama{grid-row:1;min-height:137px}

rid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:30px 0 0}.stagegrid button{text-align:left;background:white;border:0;padding:19px;min-height:126px}.stagegrid button.active{background:#edf5ff;box-shadow:inset 0 3px var(--blue)}.stagegrid button strong{display:block;font-size:19px;margin:3px 0}.stagegrid button span{color:var(--muted);font-size:13px}.section{padding:44px 0;border-bottom:1px solid var(--line);scroll-margin-top:65px}.lede{font-size:19px;color:var(--muted);max-width:920px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin:24px 0 30px}.metric{padding:17px;border-right:1px solid var(--line);border-top:3px solid var(--purple)}.metric:nth-child(2){border-top-color:var(--blue)}.metric:nth-child(3){border-top-color:var(--green)}.metric:nth-child(4){border-top-color:var(--orange);border-right:0}.metric strong{display:block;font-size:15px;margin-top:5px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:10px 13px;background:var(--light);border-bottom:1px solid var(--line)}.toolbar .spacer{flex:1}.btn{background:white;border:1px solid #c6c6c6;padding:7px 12px;color:var(--ink);font-size:13px}.btn:hover,.btn:focus-visible{border-color:var(--blue);color:var(--blue)}.btn.active,.primary{background:var(--blue);border-color:var(--blue);color:white}.btn:disabled{opacity:.4;cursor:default}.frame{border:1px solid var(--line);margin:15px 0 12px;background:white}.canvas{overflow:auto;padding:20px;background:#fafafa;min-height:200px}.canvas svg{display:block;width:100%;height:auto;margin:auto}.canvas svg .node{cursor:pointer}.canvas svg .node:hover polygon,.canvas svg .node:hover path,.canvas svg .node.selected polygon,.canvas svg .node.selected path{stroke:#0f62fe;stroke-width:2.5}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:12px 16px;border-top:1px solid var(--line)}.key{display:inline-flex;align-items:center;gap:6px}.dot{width:9px;height:9px;display:inline-block;background:var(--c)}.caption{font-size:14px;color:var(--muted);max-width:1000px}.detailrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}.detailcard{border:1px solid var(--line);padding:18px;min-height:130px}.detailcard h4{margin:0 0 10px;font-size:18px}.detailcard p{font-size:14px;color:var(--muted);margin:0}.panel{position:fixed;right:20px;top:78px;bottom:auto;z-index:20;width:390px;max-width:92vw;max-height:80vh;overflow:auto;background:white;box-shadow:0 8px 32px #0003;border:1px solid var(--line);padding:20px}.panel[hidden]{display:none}.panel h3{padding-right:30px}.panel .close{position:absolute;right:12px;top:12px}.panel ul{padding-left:18px;font-size:14px}.panel p{font-size:14px}.panel .connections{border-top:1px solid var(--line);padding-top:10px}.selector{width:100%;padding:12px;border:1px solid #8d8d8d;background:white;margin:0 0 12px}.seqcanvas{overflow:auto;background:white;max-height:660px;padding:10px}.seqcanvas svg{display:block;min-width:100%;height:auto}.replay{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin:18px 0}.replay>div{padding:18px;background:white}.replay h4{margin:5px 0;font-size:18px}.replay p{font-size:14px;color:var(--muted)}.hop{display:flex;align-items:center;justify-content:center;gap:10px;min-height:85px}.hop span{padding:10px;border:1px solid #a6c8ff;background:#edf5ff;max-width:45%;text-align:center;font-size:14px}.hop i{font-size:24px;color:var(--blue);font-style:normal}.range{width:100%;accent-color:var(--blue)}.tag{font:11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}pre{background:var(--light);border:1px solid var(--line);padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;margin:8px 0}.source pre{white-space:pre;overflow:auto;max-height:430px}.source{margin:12px 0;border:1px solid var(--line);padding:10px 15px}.source summary{cursor:pointer;font-size:14px;font-weight:600}.lab{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);gap:1px;background:var(--line)}.lab>div{background:white;padding:20px}.lab select{width:100%;padding:8px;border:1px solid #8d8d8d;margin:6px 0 16px}.checks{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}.check{padding:8px 10px;border:1px solid #8d8d8d;background:white;font-size:13px}.check[aria-pressed=true]{background:#edf5ff;border-color:var(--blue)}.check[aria-pressed=false]{text-decoration:line-through;color:#777}.decision{padding:14px 16px;border-left:4px solid var(--green);background:#defbe6;font-weight:600;margin-bottom:10px}.decision.deny{border-color:var(--red);background:#fff1f1}.decision.unknown{border-color:var(--orange);background:#fff2e8}.tablewrap{overflow:auto;border:1px solid var(--line);margin:15px 0 25px}table{width:100%;border-collapse:collapse;font-size:13px;min-width:650px}td,th{padding:12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}th{background:#e8e8e8;font-weight:600}tr:last-child td{border-bottom:0}.catalogsearch{padding:12px;border:1px solid #8d8d8d;width:100%;margin-bottom:12px}.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}.catalog button{background:white;border:0;text-align:left;padding:14px}.catalog button:hover{background:#edf5ff}.catalog strong{display:block;font-size:15px}.catalog span{font-size:12px;color:var(--muted)}.note{border-left:3px solid var(--blue);padding:12px 15px;background:#edf5ff;font-size:14px;margin:15px 0}.footer{padding:25px 0;color:var(--muted);font-size:13px}.modal{position:fixed;inset:0;background:#0007;z-index:30;padding:25px;display:grid;place-items:center}.modal[hidden]{display:none}.modalinner{width:100%;height:100%;background:white;display:flex;flex-direction:column}.modalinner .canvas{flex:1}.modalinner .canvas svg{width:auto;max-width:none;height:auto;min-width:100%}[hidden]{display:none!important}@media(max-width:800px){.wrap{padding:0 18px}.stagegrid,.metrics{grid-template-columns:repeat(2,1fr)}.detailrow,.replay,.lab{grid-template-columns:1fr}.catalog{grid-template-columns:repeat(2,1fr)}.hero{padding:35px 0 22px}.nav{gap:0}.nav button{padding:10px}.brand{margin-right:8px}h2{font-size:30px}.canvas{padding:8px}.canvas svg{min-width:720px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}\n@media (max-width:620px) {\n .top .brand { display:none }\n .top .nav { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); min-height:48px; padding-inline:8px; white-space:normal }\n .top .nav button { min-height:44px; padding:7px 3px; font-size:12px; line-height:1.2 }\n}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader class=\"top\">\u003cdiv class=\"wrap nav\">\u003cdiv class=\"brand\">TRUST BOUNDARIES / Enterprise Architecture\u003c/div>\u003cbutton data-jump=\"architecture\" class=\"active\">Architecture\u003c/button>\u003cbutton data-jump=\"sequences\">Sequences\u003c/button>\u003cbutton data-jump=\"lab\">Decision lab\u003c/button>\u003cbutton data-jump=\"reference\">Reference\u003c/button>\u003c/div>\u003c/header>\n\u003cmain>\u003cdiv class=\"wrap\">\u003csection class=\"hero\">\u003cdiv class=\"eyebrow\">A technical guide for enterprise architects · standalone reference\u003c/div>\u003ch1>Securing agents across the enterprise.\u003c/h1>\u003cp>Follow the evolution from an unmanaged agent to governed autonomy. Inspect the architecture, replay each request and trace the evidence at every trust boundary.\u003c/p>\u003cdiv id=\"stagegrid\" class=\"stagegrid\">\u003c/div>\u003c/section>\n\u003csection class=\"section\" id=\"architecture\">\u003cdiv class=\"eyebrow\" id=\"stageNum\">\u003c/div>\u003ch2 id=\"stageTitle\">\u003c/h2>\u003cp id=\"stageIntro\" class=\"lede\">\u003c/p>\u003cdiv class=\"metrics\" id=\"metrics\">\u003c/div>\u003ch3>Connected architecture\u003c/h3>\u003cp class=\"caption\">Select a component to inspect its role and connections. Switch to the detailed topology to see the control-plane and telemetry paths.\u003c/p>\u003cdiv class=\"frame\">\u003cdiv class=\"toolbar\">\u003cbutton class=\"btn active\" id=\"overview\">Overview\u003c/button>\u003cbutton class=\"btn\" id=\"full\">Detailed topology\u003c/button>\u003cdiv class=\"spacer\">\u003c/div>\u003cbutton class=\"btn\" id=\"zoomout\" aria-label=\"Zoom out\">−\u003c/button>\u003cbutton class=\"btn\" id=\"zoomin\" aria-label=\"Zoom in\">+\u003c/button>\u003cbutton class=\"btn\" id=\"expand\">Expand\u003c/button>\u003c/div>\u003cdiv class=\"canvas\" id=\"architectureCanvas\">\u003c/div>\u003cdiv class=\"legend\">\u003cspan class=\"key\">\u003ci class=\"dot\" style=\"--c:#8a3ffc\">\u003c/i>Identity / authority\u003c/span>\u003cspan class=\"key\">\u003ci class=\"dot\" style=\"--c:#0f62fe\">\u003c/i>Enforcement\u003c/span>\u003cspan class=\"key\">\u003ci class=\"dot\" style=\"--c:#198038\">\u003c/i>Resources\u003c/span>\u003cspan class=\"key\">\u003ci class=\"dot\" style=\"--c:#b65c00\">\u003c/i>Evidence / response\u003c/span>\u003cspan class=\"key\">\u003ci class=\"dot\" style=\"--c:#da1e28\">\u003c/i>Unsafe or blocked\u003c/span>\u003cspan>Dashed: signals / control context · * customer integration\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"caption\" id=\"archNote\">\u003c/p>\u003cdiv class=\"detailrow\">\u003cdiv class=\"detailcard\">\u003csmall>Security invariant\u003c/small>\u003ch4 id=\"invariant\">\u003c/h4>\u003cp id=\"invariantDetail\">\u003c/p>\u003c/div>\u003cdiv class=\"detailcard\">\u003csmall>Residual risk\u003c/small>\u003ch4 id=\"residual\">\u003c/h4>\u003cp id=\"residualDetail\">\u003c/p>\u003c/div>\u003c/div>\u003cdetails class=\"source\">\u003csummary>Architecture Mermaid source\u003c/summary>\u003cbutton class=\"btn\" data-copy=\"arch\">Copy source\u003c/button>\u003cpre id=\"archSource\">\u003c/pre>\u003c/details>\u003c/section>\n\u003csection class=\"section\" id=\"sequences\">\u003cdiv class=\"eyebrow\">Request paths · sequence diagrams\u003c/div>\u003ch2>One request, end to end.\u003c/h2>\u003cp class=\"lede\">Select a sequence and step through its ordered interactions. Alternative branches are explicitly labelled; the replay is a walkthrough of the diagram, not a live transaction.\u003c/p>\u003cselect id=\"seqSelect\" class=\"selector\" aria-label=\"Sequence diagram\">\u003c/select>\u003cdiv class=\"frame\">\u003cdiv class=\"toolbar\">\u003cbutton class=\"btn\" id=\"prev\">Previous\u003c/button>\u003cbutton class=\"btn primary\" id=\"play\">Play\u003c/button>\u003cbutton class=\"btn\" id=\"next\">Next\u003c/button>\u003cbutton class=\"btn\" id=\"reset\">Reset\u003c/button>\u003cdiv class=\"spacer\">\u003c/div>\u003cspan id=\"stepCounter\" class=\"mono\" style=\"font-size:12px\">\u003c/span>\u003cbutton class=\"btn\" id=\"seqExpand\">Expand\u003c/button>\u003c/div>\u003cdiv class=\"seqcanvas\" id=\"seqCanvas\">\u003c/div>\u003c/div>\u003cinput class=\"range\" type=\"range\" min=\"0\" value=\"0\" id=\"scrub\" aria-label=\"Replay step\">\u003cdiv class=\"replay\">\u003cdiv>\u003cspan class=\"tag\" id=\"branch\">\u003c/span>\u003ch4 id=\"stepTitle\">\u003c/h4>\u003cdiv class=\"hop\" id=\"hop\">\u003c/div>\u003cp id=\"stepBody\">\u003c/p>\u003c/div>\u003cdiv>\u003cspan class=\"tag\">Illustrative evidence contract\u003c/span>\u003cpre id=\"evidence\">\u003c/pre>\u003c/div>\u003c/div>\u003cp class=\"caption\" id=\"seqNote\">\u003c/p>\u003cdetails class=\"source\">\u003csummary>Mermaid sequence source\u003c/summary>\u003cbutton class=\"btn\" data-copy=\"seq\">Copy source\u003c/button>\u003cpre id=\"seqSource\">\u003c/pre>\u003c/details>\u003c/section>\n\u003csection class=\"section\" id=\"lab\">\u003cdiv class=\"eyebrow\">Interactive control walkthrough\u003c/div>\u003ch2>Peel the defenses.\u003c/h2>\u003cp class=\"lede\">Change a request or remove a control to see the resulting failure mode. This is a deterministic teaching simulation, not a security product test.\u003c/p>\u003cdiv class=\"lab\">\u003cdiv>\u003csmall>Request\u003c/small>\u003cselect id=\"labRequest\">\u003coption value=\"read\">Read RE-204 operational records\u003c/option>\u003coption value=\"finance\">Read unrelated payment records\u003c/option>\u003coption value=\"export\">Send confidential report to external recipient\u003c/option>\u003coption value=\"stale\">Commit after mission suspension\u003c/option>\u003coption value=\"delegate\">Delegate outside parent mission\u003c/option>\u003c/select>\u003csmall>Controls available for this stage\u003c/small>\u003cdiv class=\"checks\" id=\"layerChecks\">\u003c/div>\u003cbutton class=\"btn\" id=\"labReset\">Restore stage controls\u003c/button>\u003c/div>\u003cdiv>\u003csmall>Decision and evidence\u003c/small>\u003cdiv id=\"labDecision\" class=\"decision\">\u003c/div>\u003cdiv id=\"labReason\">\u003c/div>\u003cpre id=\"labTrace\">\u003c/pre>\u003c/div>\u003c/div>\u003cp class=\"caption\" style=\"margin-top:12px\">Missing controls create an exposure, not proof that a particular bypass succeeds. Native resource rules and external enforcement can still deny the operation.\u003c/p>\u003c/section>\n\u003csection class=\"section\" id=\"reference\">\u003cdiv class=\"eyebrow\">Architecture reference\u003c/div>\u003ch2>Components, contracts and ownership.\u003c/h2>\u003cp class=\"lede\">Inspect the systems in the selected architecture. Integration components are marked with an asterisk and require implementation and verification.\u003c/p>\u003cinput class=\"catalogsearch\" type=\"search\" id=\"catalogSearch\" placeholder=\"Filter by product, role or component…\">\u003cdiv class=\"catalog\" id=\"catalog\">\u003c/div>\u003ch3 style=\"margin-top:35px\">Trust boundaries and interface contracts\u003c/h3>\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003ctr>\u003cth>Boundary\u003c/th>\u003cth>Evidence / protocol\u003c/th>\u003cth>Enforcement owner\u003c/th>\u003cth>Key failure case\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Human to mission\u003c/td>\u003ctd>OIDC/OAuth identity, sponsor authority, signed/versioned mission record\u003c/td>\u003ctd>Verify + Mission Authority *\u003c/td>\u003ctd>Valid identity outside business authority\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Agent registration to workload\u003c/td>\u003ctd>Logical agent ID, SPIFFE SVID, trusted instance and generation mapping\u003c/td>\u003ctd>IBM Agent Identity + SPIRE + admission *\u003c/td>\u003ctd>Registered agent in unauthorized runtime\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>OpenShell gateway to supervisor\u003c/td>\u003ctd>Native generation-bound JWT / TLS and private provisioning\u003c/td>\u003ctd>OpenShell\u003c/td>\u003ctd>Stale or incorrect runtime generation\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Workload to network\u003c/td>\u003ctd>Mediated runtime channel, destination/process policy\u003c/td>\u003ctd>OpenShell supervisor and outer network fence\u003c/td>\u003ctd>Direct unapproved egress\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>MCP client to gateway\u003c/td>\u003ctd>Audience-specific OAuth token, endpoint/tool/arguments\u003c/td>\u003ctd>MCP gateway / server\u003c/td>\u003ctd>Wrong audience or unknown tool\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Connector to Vault\u003c/td>\u003ctd>Separate Vault-audience token, RAR and agent/subject policies\u003c/td>\u003ctd>Vault\u003c/td>\u003ctd>Credential path outside ceiling\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>PEP to business PDP\u003c/td>\u003ctd>Authenticated service request, canonical parameters, policy/mission version\u003c/td>\u003ctd>PDP * with resource PEP *\u003c/td>\u003ctd>Self-reported agent intent or stale permit\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Connector to backend\u003c/td>\u003ctd>Separate backend credential, native ACL/role and actual operation\u003c/td>\u003ctd>Resource / resource PEP\u003c/td>\u003ctd>Valid credential, prohibited record or operation\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Agent to memory\u003c/td>\u003ctd>Identity, mission namespace, authorized document IDs\u003c/td>\u003ctd>Memory / retrieval service *\u003c/td>\u003ctd>Cross-mission memory or poisoned source\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Agent to agent\u003c/td>\u003ctd>Verified actor, parent grant, child ceiling, aggregate budget\u003c/td>\u003ctd>A2A gateway + delegation service *\u003c/td>\u003ctd>Confused deputy or transitive scope growth\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Approval to commit\u003c/td>\u003ctd>Immutable digest, recipient, action, expiry, generation, idempotency key\u003c/td>\u003ctd>Approval and resource services *\u003c/td>\u003ctd>Edited artifact or duplicate action\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Telemetry to response\u003c/td>\u003ctd>Authenticated event source, correlated evidence, response authority, acknowledgement\u003c/td>\u003ctd>SOC / response controller *\u003c/td>\u003ctd>Signal sent without actual revocation\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3>Identity and credential types that must remain separate\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003ctr>\u003cth>Credential\u003c/th>\u003cth>Issuer / custody\u003c/th>\u003cth>Audience and purpose\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>OpenShell session JWT\u003c/td>\u003ctd>OpenShell Gateway; trusted supervisor holds gateway token\u003c/td>\u003ctd>Native sandbox lifecycle/control connection; not a business credential\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>MCP access token\u003c/td>\u003ctd>Configured OAuth authorization server\u003c/td>\u003ctd>Specific client-facing MCP resource; validate audience and do not pass blindly downstream\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Vault-audience OAuth token\u003c/td>\u003ctd>Configured Verify/issuer; trusted connector\u003c/td>\u003ctd>Vault resource-server access, subject/actor semantics and RAR constraints\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Backend credential\u003c/td>\u003ctd>Vault or target-native issuer; trusted connector\u003c/td>\u003ctd>Database/service access; target enforces its own scopes, role and operation\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>SPIFFE SVID\u003c/td>\u003ctd>SPIRE; workload or service custody\u003c/td>\u003ctd>Workload authentication / mTLS; not evidence of approved business mission by itself\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3>Mission and decision ownership\u003c/h3>\n\u003cp>The Mission Authority owns the mission ID, issuer, subject, agent, purpose, allowed resource/action constraints, permitted destinations, expiry, budget, parent mission, version and state. Store it outside the agent&#x27;s editable memory. The business PDP retrieves authoritative attributes through a PIP and returns a bound decision to an authenticated resource PEP. The PEP obtains operation and parameters from the actual request and validates currency of the decision before execution. Vault applies a separate, non-expanding credential decision: delegated OBO uses human baseline ACL, agent ceiling and applicable RAR; autonomous uses its own baseline and applicable constraints. A successful lease cannot authorize unrelated business data.\u003c/p>\n\u003ch3>Product responsibility and implementation status\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003ctr>\u003cth>Component\u003c/th>\u003cth>Product capability / configured use\u003c/th>\u003cth>Additional work required\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>IBM Agent Identity / Verify\u003c/td>\u003ctd>Agent registration, verified identity, configured token exchange/OBO\u003c/td>\u003ctd>Mission registry and authoritative linkage to runtime and resource context\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Vault Enterprise 2.1+ Agentic IAM\u003c/td>\u003ctd>OAuth resource server, Agent Registry, RAR and OBO ceilings\u003c/td>\u003ctd>Configure issuer, resource audience, mappings, leases and target roles; test revocation\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>NVIDIA OpenShell\u003c/td>\u003ctd>Gateway, compute drivers, trusted supervisor, native session credentials, runtime isolation and mediation\u003c/td>\u003ctd>External mission admission and provider adapter; validate version/driver capabilities\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Red Hat OpenShift / ZTWIM\u003c/td>\u003ctd>Workload platform and SPIRE lifecycle\u003c/td>\u003ctd>Bind deployment identities to agent and mission; separate hardware posture if required\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>agentgateway or IBM DataPower Interact Gateway\u003c/td>\u003ctd>Configured HTTP/model/MCP enforcement\u003c/td>\u003ctd>Actual parameter and resource-side integration; choose one primary gateway per route\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>OPA / OpenFGA\u003c/td>\u003ctd>Policy evaluation and relationship checks\u003c/td>\u003ctd>Customer policy service, policy lifecycle, trusted PIP and transaction binding\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>HashiCorp Boundary\u003c/td>\u003ctd>Controlled connection paths\u003c/td>\u003ctd>Maintain resource PEP and native resource permissions; verify session termination\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Confluent Kafka / Flink\u003c/td>\u003ctd>Streaming data, topic access, event correlation\u003c/td>\u003ctd>Filter by record/business purpose, normalize events, implement risk and response controllers\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>DataStax Astra DB\u003c/td>\u003ctd>Vector retrieval and application data\u003c/td>\u003ctd>Trusted memory/retrieval service, namespace access, classification, provenance and quarantine\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>watsonx Orchestrate\u003c/td>\u003ctd>Agent orchestration, evaluation; supported discovery and containment (verify preview availability)\u003c/td>\u003ctd>Mission-aware launch and cross-product containment integration\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Identity Protection / QRadar / OpenTelemetry\u003c/td>\u003ctd>Connected identity signals, SOC analysis, telemetry\u003c/td>\u003ctd>Complete coverage, normalized correlation and response policy\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch2>Source anchors and assumptions\u003c/h2>\n\u003cul>\n\u003cli>Existing project: \u003ca href=\"https://github.com/lpassig/trust-boundaries/blob/main/v2/architecture.js\" target=\"_blank\" rel=\"noopener noreferrer\">architecture.js\u003c/a>, \u003ca href=\"https://github.com/lpassig/trust-boundaries/blob/main/TECHNICAL-VALIDATION.md\" target=\"_blank\" rel=\"noopener noreferrer\">technical validation\u003c/a>. The earlier reference used a CRM handover. This guide uses Nova&#x27;s railway scenario and keeps the resource PEP, mission versions, independent authorization and verified closure contracts.\u003c/li>\n\u003cli>\u003ca href=\"https://docs.nvidia.com/openshell/about/architecture\" target=\"_blank\" rel=\"noopener noreferrer\">NVIDIA OpenShell architecture\u003c/a>: gateway, compute runtime, supervisor, sandbox, native bootstrapping and network mediation. Confirm the specific release and driver before implementation.\u003c/li>\n\u003cli>\u003ca href=\"https://developer.hashicorp.com/vault/ai\" target=\"_blank\" rel=\"noopener noreferrer\">Vault Agentic IAM\u003c/a>, \u003ca href=\"https://docs.hashicorp.com/vault/ai/iam/concepts/oauth-profiles\" target=\"_blank\" rel=\"noopener noreferrer\">OAuth resource server\u003c/a>, \u003ca href=\"https://docs.hashicorp.com/vault/ai/iam/concepts/rar\" target=\"_blank\" rel=\"noopener noreferrer\">RAR\u003c/a>, \u003ca href=\"https://developer.hashicorp.com/vault/docs/auth/spiffe\" target=\"_blank\" rel=\"noopener noreferrer\">SPIFFE authentication\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://docs.redhat.com/en/documentation/openshift_container_platform/4.22/html/security_and_compliance/zero-trust-workload-identity-manager\" target=\"_blank\" rel=\"noopener noreferrer\">Red Hat ZTWIM\u003c/a>, \u003ca href=\"https://spiffe.io/docs/latest/spiffe-about/spiffe-concepts/\" target=\"_blank\" rel=\"noopener noreferrer\">SPIFFE concepts\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://modelcontextprotocol.io/specification/latest\" target=\"_blank\" rel=\"noopener noreferrer\">MCP specification\u003c/a>, \u003ca href=\"https://openid.net/specs/authorization-api-1_0.html\" target=\"_blank\" rel=\"noopener noreferrer\">AuthZEN authorization API\u003c/a>, \u003ca href=\"https://www.ibm.com/docs/en/dp-interact-gateway/12.1.1?topic=servers-mcp-server-policies\" target=\"_blank\" rel=\"noopener noreferrer\">IBM DataPower MCP policies\u003c/a>.\u003c/li>\n\u003cli>The previous uploaded IBM announcement (October 27, 2026), Red Hat/HashiCorp demo and Entra–Verify–Vault reference informed the prior Nova narrative. This standalone design does not assume a native mission-aware PDP, mission-aware memory, universal risk receivers, or coordinated revocation as shipping product features. No end-to-end integration has been tested.\u003c/li>\n\u003c/ul>\u003c/section>\u003cfooter class=\"footer\">Illustrative enterprise reference · separate from Alex and Nova story state · no real credentials, access changes or security operations.\u003c/footer>\u003c/div>\u003c/main>\n\u003caside class=\"panel\" id=\"detail\" hidden aria-label=\"Component details\">\u003cbutton class=\"btn close\" id=\"closeDetail\" aria-label=\"Close detail\">×\u003c/button>\u003csmall id=\"detailKind\">\u003c/small>\u003ch3 id=\"detailTitle\">\u003c/h3>\u003cp id=\"detailBody\">\u003c/p>\u003cdiv class=\"connections\">\u003csmall>Connected interfaces\u003c/small>\u003cul id=\"detailLinks\">\u003c/ul>\u003c/div>\u003c/aside>\n\u003cdiv class=\"modal\" id=\"modal\" hidden>\u003cdiv class=\"modalinner\">\u003cdiv class=\"toolbar\">\u003cstrong id=\"modalTitle\">\u003c/strong>\u003cdiv class=\"spacer\">\u003c/div>\u003cbutton class=\"btn\" id=\"closeModal\">Close ×\u003c/button>\u003c/div>\u003cdiv class=\"canvas\" id=\"modalCanvas\">\u003c/div>\u003c/div>\u003c/div>\n\u003cscript id=\"stageData\" type=\"application/json\">[{\"name\": \"UNKNOWN\", \"heading\": \"Discover what is runnin l authority\", \"return\": false, \"n\": 10}, {\"type\": \"msg\", \"a\": \"U\", \"b\": \"M\", \"label\": \"Approve RE-204 operational data only\", \"return\": true, \"n\": 11}, {\"type\": \"msg\", \"a\": \"M\", \"b\": \"M\", \"label\": \"Advance mission version; invalidate superseded grants\", \"return\": false, \"n\": 12}, {\"type\": \"msg\", \"a\": \"N\", \"b\": \"G\", \"label\": \"Retry the permitted read\", \"return\": false, \"n\": 13}, {\"type\": \"msg\", \"a\": \"G\", \"b\": \"P\", \"label\": \"Forward authenticated actual request\", \"return\": false, \"n\": 14}, {\"type\": \"msg\", \"a\": \"P\", \"b\": \"D\", \"label\": \"Submit canonical request and verified identity evidence\", \"return\": false, \"n\": 15}, {\"type\": \"msg\", \"a\": \"D\", \"b\": \"M\", \"label\": \"Read current mission and resource attributes via PIP\", \"return\": false, \"n\": 16}, {\"type\": \"msg\", \"a\": \"D\", \"b\": \"P\", \"label\": \"Short-lived bound permit for this read\", \"return\": true, \"n\": 17}, {\"type\": \"msg\", \"a\": \"P\", \"b\": \"I\", \"label\": \"Request Vault-audience OBO token with RAR for credential role\", \"return\": false, \"n\": 18}, {\"type\": \"msg\", \"a\": \"I\", \"b\": \"P\", \"label\": \"Signed Vault-audience token\", \"return\": true, \"n\": 19}, {\"type\": \"msg\", \"a\": \"P\", \"b\": \"V\", \"label\": \"Request dynamic credential under configured role\", \"return\": false, \"n\": 20}, {\"type\": \"msg\", \"a\": \"V\", \"b\": \"V\", \"label\": \"Validate issuer, audience, lifetime, actor registry, ACL, ceiling and RAR\", \"return\": false, \"n\": 21}, {\"type\": \"alt\", \"label\": \"Vault denies\"}, {\"type\": \"msg\", \"a\": \"V\", \"b\": \"P\", \"label\": \"No credential issued\", \"return\": true, \"n\": 22}, {\"type\": \"msg\", \"a\": \"P\", \"b\": \"N\", \"label\": \"Resource call not executed\", \"return\": true, \"n\": 23}, {\"type\": \"else\", \"label\": \"Vault permits\"}, {\"type\": \"msg\", \"a\": \"V\", \"b\": \"P\", \"label\": \"Lease and scoped backend credential\", \"return\": true, \"n\": 24}, {\"type\": \"msg\", \"a\": \"P\", \"b\": \"P\", \"label\": \"Recheck decision bindings, current mission and actual parameters\", \"return\": false, \"n\": 25}, {\"type\": \"msg\", \"a\": \"P\", \"b\": \"R\", \"label\": \"Execute allowed read with backend credential (optional Boundary path)\", \"return\": false, \"n\": 26}, {\"type\": \"msg\", \"a\": \"R\", \"b\": \"R\", \"label\": \"Enforce native role, view or topic authorization\", \"return\": false, \"n\": 27}, {\"type\": \"msg\", \"a\": \"R\", \"b\": \"P\", \"label\": \"Permitted records only\", \"return\": true, \"n\": 28}, {\"type\": \"msg\", \"a\": \"P\", \"b\": \"N\", \"label\": \"Filtered response and provenance via gateway\", \"return\": true, \"n\": 29}, {\"type\": \"msg\", \"a\": \"P\", \"b\": \"P\", \"label\": \"Record execution outcome and correlate lease / decision\", \"return\": false, \"n\": 30}, {\"type\": \"end\", \"label\": \"\"}], \"after\": \"Vault credential issuance here uses the delegated OAuth/RAR profile. The autonomous alternative uses agent baseline ACLs and applicable token constraints, or a configured workload authentication path with narrowly scoped Vault roles. Do not concatenate SPIFFE login, MCP bearer token and Vault-audience OBO token into one interchangeable credential.\"}, {\"title\": \"Sequence 2.2 — Cross-mission access, expiry and closure\", \"source\": \"sequenceDiagram\\n  autonumber\\n  participant N as Nova\\n  participant P as Resource PEP / memory service *\\n  participant D as Business PDP *\\n  participant M as Mission registry *\\n  participant V as Vault\\n  participant R as Backend / session controller\\n  N->>P: Use M-204 authorization while executing M-105\\n  P->>D: Submit actual mission and credential binding\\n  D->>M: Read current mission scope and generation\\n  M-->>D: M-105 does not include M-204 data\\n  D-->>P: Deny mismatch\\n  P-->>N: No data returned\\n  N->>P: Read memory namespace for M-204 under M-105\\n  P-->>N: Deny cross-mission access\\n  M->>M: Mark M-204 completed, prevent new grants\\n  M->>V: Revoke associated revocable leases via response adapter *\\n  M->>R: Close active backend session where supported\\n  M->>P: Invalidate M-204 decision and storage grants\\n  R-->>M: Report verified closure or incomplete coverage\\n  Note over N,M: M-105 remains active; no blanket revocation of unrelated missions\", \"actors\": {\"N\": \"Nova\", \"P\": \"Resource PEP / memory service *\", \"D\": \"Business PDP *\", \"M\": \"Mission registry *\", \"V\": \"Vault\", \"R\": \"Backend / session controller\"}, \"rows\": [{\"type\": \"msg\", \"a\": \"N\", \"b\": \"P\", \"label\": \"Use M-204 authorization while executing M-105\", \"return\": false, \"n\": 1}, {\"type\": \"msg\", \"a\": \"P\", \"b\": \"D\", \"label\": \"Submit actual mission and credential binding\", \"return\": false, \"n\": 2}, {\"type\": \"msg\", \"a\": \"D\", \"b\": \"M\", \"label\": \"Read current mission scope and generation\", \"return\": false, \"n\": 3}, {\"type\": \"msg\", \"a\": \"M\", \"b\": \"D\", \"label\": \"M-105 does not include M-204 data\", \"return\": true, \"n\": 4}, {\"type\": \"msg\", \"a\": \"D\", \"b\": \"P\", \"label\": \"Deny mismatch\", \"return\": true, \"n\": 5}, {\"type\": \"msg\", \"a\": \"P\", \"b\": \"N\", \"label\": \"No data returned\", \"return\": true, \"n\": 6}, {\"type\": \"msg\", \"a\": \"N\", \"b\": \"P\", \"label\": \"Read memory namespace for M-204 under M-105\", \"return\": false, \"n\": 7}, {\"type\": \"msg\", \"a\": \"P\", \"b\": \"N\", \"label\": \"Deny cross-mission access\", \"return\": true, \"n\": 8}, {\"type\": \"msg\", \"a\": \"M\", \"b\": \"M\", \"label\": \"Mark M-204 completed, prevent new grants\", \"return\": false, \"n\": 9}, {\"type\": \"msg\", \"a\": \"M\", \"b\": \"V\", \"label\": \"Revoke associated revocable leases via response adapter *\", \"return\": false, \"n\": 10}, {\"type\": \"msg\", \"a\": \"M\", \"b\": \"R\", \"label\": \"Close active backend session where supported\", \"return\": false, \"n\": 11}, {\"type\": \"msg\", \"a\": \"M\", \"b\": \"P\", \"label\": \"Invalidate M-204 decision and storage grants\", \"return\": false, \"n\": 12}, {\"type\": \"msg\", \"a\": \"R\", \"b\": \"M\", \"label\": \"Report verified closure or incomplete coverage\", \"return\": true, \"n\": 13}, {\"type\": \"note\", \"a\": \"N,M\", \"label\": \"M-105 remains active; no blanket revocation of unrelated missions\"}], \"after\": \"**Verification:** successful operation depends on both business authorization and credential authorization. The resource PEP rejects changed train IDs, unauthorized operation, stale mission version, invalid audience, cross-mission memory and expired or revoked access. No direct resource route from the sandbox exists.\"}], \"note\": \"**Connectivity note:** the resource PEP may be in a data-access service or embedded in the actual resource. Boundary is an optional transport control; it must not expose an alternative route that bypasses the resource PEP or database restrictions. For the database flow below, the connector and resource PEP are one trusted service, and its optional Boundary connection is used only after permit. The same pattern applies to Kafka and Astra DB, using their own credentials and downstream controls. Kafka topic RBAC/ACLs do not provide train-ID filtering; implement that in a trusted service or partitioned data design. Astra DB metadata filters are not an authorization boundary on their own.\"}, {\"name\": \"RESIST\", \"heading\": \"Keep autonomy bounded as risk changes.\", \"intro\": \"Extend the same request path to specialist agents, exact human approvals, event-driven missions and independently verified containment.\", \"metrics\": [[\"Delegation\", \"Child mission and shared budget\"], [\"Execution\", \"Commit-time decision and idempotency\"], [\"Signals\", \"Confluent + Flink + OTel\"], [\"Response\", \"Suspend, revoke, retest and recover\"]],  authorization interface or idempotency support leaves a residual race or duplicate-effect risk. Do not claim distributed exactly-once delivery merely because Kafka is used.\"}, {\"title\": \"Sequence 3.4 — Continuous risk, cascading revocation and recovery\", \"source\": \"sequenceDiagram\\n  autonumber\\n  participant P as Runtime / PEP / Vault sensors\\n  participant K as Confluent security topics\\n  participant F as Flink correlation\\n  participant C as SOC / authorized response controller *\\n  participant M as Mission Authority *\\n  participant I as IBM Verify / Agent Identity\\n  participant V as Vault\\n  participant O as OpenShell Gateway\\n  participant R as Resource PEP / backend controllers\\n  P-->>K: Denials, credential events, actual effects and runtime evidence\\n  K-->>F: Correlated event stream\\n  F-->>C: Risk signal with mission, identity, severity and evidence\\n  C->>C: Validate event and response policy; deduplicate\\n  C->>M: Suspend affected mission and linked child grants\\n  M-->>C: Current generation retired; new grants blocked\\n  par Identity / delegation control\\n    C->>I: Suspend relevant authorization or identity where supported\\n    I-->>C: Acknowledgement or unsupported status\\n  and Credential control\\n    C->>V: Revoke associated leases / disable affected credential path\\n    V-->>C: Revocation result\\n  and Runtime control\\n    C->>O: Stop or quarantine affected sandbox generation\\n    O-->>C: Runtime status\\n  and Downstream control\\n    C->>R: Reject new calls, close sessions, cancel waiting work and child access\\n    R-->>C: Per-resource results\\n  end\\n  C->>R: Independently retest old routes and inspect pending operations\\n  alt All required paths verified closed\\n    R-->>C: Verified containment for tested scope\\n  else Any path still active or unreachable\\n    R-->>C: Partial / unverified containment; continue escalation\\n  end\\n  C->>C: Preserve evidence and investigate actual effects\\n  C->>M: Authorized recovery after remediation and fresh policy evaluation\\n  M->>O: New bounded mission generation / admitted runtime\\n  Note over M,R: Old tokens, approvals and child grants are not reused; unrelated missions stay active where safe\", \"actors\": {\"P\": \"Runtime / PEP / Vault sensors\", \"K\": \"Confluent security topics\", \"F\": \"Flink correlation\", \"C\": \"SOC / authorized response controller *\", \"M\": \"Mission Authority *\", \"I\": \"IBM Verify / Agent Identity\", \"V\": \"Vault\", \"O\": \"OpenShell Gateway\", \"R\": \"Resource PEP / backend controllers\"}, \"rows\": [{\"type\": \"msg\", \"a\": \"P\", \"b\": \"K\", \"label\": \"Denials, credential events, actual effects and runtime evidence\", \"return\": true, \"n\": 1}, {\"type\": \"msg\", \"a\": \"K\", \"b\": \"F\", \"label\": \"Correlated event stream\", \"return\": true, \"n\": 2}, {\"type\": \"msg\", \"a\": \"F\", \"b\": \"C\", \"label\": \"Risk signal with mission, identity, severity and evidence\", \"return\": true, \"n\": 3}, {\"type\": \"msg\", \"a\": \"C\", \"b\": \"C\", \"label\": \"Validate event and response policy; deduplicate\", \"return\": false, \"n\": 4}, {\"type\": \"msg\", \"a\": \"C\", \"b\": \"M\", \"label\": \"Suspend affected mission and linked child grants\", \"return\": false, \"n\": 5}, {\"type\": \"msg\", \"a\": \"M\", \"b\": \"C\", \"label\": \"Current generation retired; new grants blocked\", \"return\": true, \"n\": 6}, {\"type\": \"par\", \"label\": \"Identity / delegation control\"}, {\"type\": \"msg\", \"a\": \"C\", \"b\": \"I\", \"label\": \"Suspend relevant authorization or identity where supported\", \"return\": false, \"n\": 7}, {\"type\": \"msg\", \"a\": \"I\", \"b\": \"C\", \"label\": \"Acknowledgement or unsupported status\", \"return\": true, \"n\": 8}, {\"type\": \"and\", \"label\": \"Credential control\"}, {\"type\": \"msg\", \"a\": \"C\", \"b\": \"V\", \"label\": \"Revoke associated leases / disable affected credential path\", \"return\": false, \"n\": 9}, {\"type\": \"msg\", \"a\": \"V\", \"b\": \"C\", \"label\": \"Revocation result\", \"return\": true, \"n\": 10}, {\"type\": \"and\", \"label\": \"Runtime control\"}, {\"type\": \"msg\", \"a\": \"C\", \"b\": \"O\", \"label\": \"Stop or quarantine affected sandbox generation\", \"return\": false, \"n\": 11}, {\"type\": \"msg\", \"a\": \"O\", \"b\": \"C\", \"label\": \"Runtime status\", \"return\": true, \"n\": 12}, {\"type\": \"and\", \"label\": \"Downstream control\"}, {\"type\": \"msg\", \"a\": \"C\", \"b\": \"R\", \"label\": \"Reject new calls, close sessions, cancel waiting work and child access\", \"return\": false, \"n\": 13}, {\"type\": \"msg\", \"a\": \"R\", \"b\": \"C\", \"label\": \"Per-resource results\", \"return\": true, \"n\": 14}, {\"type\": \"end\", \"label\": \"\"}, {\"type\": \"msg\", \"a\": \"C\", \"b\": \"R\", \"label\": \"Independently retest old routes and inspect pending operations\", \"return\": false, \"n\": 15}, {\"type\": \"alt\", \"label\": \"All required paths verified closed\"}, {\"type\": \"msg\", \"a\": \"R\", \"b\": \"C\", \"label\": \"Verified containment for tested scope\", \"return\": true, \"n\": 16}, {\"type\": \"else\", \"label\": \"Any path still active or unreachable\"}, {\"type\": \"msg\", \"a\": \"R\", \"b\": \"C\", \"label\": \"Partial / unverified containment; continue escalation\", \"return\": true, \"n\": 17}, {\"type\": \"end\", \"label\": \"\"}, {\"type\": \"msg\", \"a\": \"C\", \"b\": \"C\", \"label\": \"Preserve evidence and investigate actual effects\", \"return\": false, \"n\": 18}, {\"type\": \"msg\", \"a\": \"C\", \"b\": \"M\", \"label\": \"Authorized recovery after remediation and fresh policy evaluation\", \"return\": false, \"n\": 19}, {\"type\": \"msg\", \"a\": \"M\", \"b\": \"O\", \"label\": \"New bounded mission generation / admitted runtime\", \"return\": false, \"n\": 20}, {\"type\": \"note\", \"a\": \"M,R\", \"label\": \"Old tokens, approvals and child grants are not reused; unrelated missions stay active where safe\"}], \"after\": \"**Verification:** prove permit and deny cases with resource receipts, child-grant limits, aggregate budget, tampered artifact denial, stale approval rejection, idempotency, outage behaviour, revoked lease/session retest and independently collected audit. A completed external action cannot be undone simply by suspending the agent.\"}], \"note\": \"The runtime, identity service, mission registry, Vault and backend are independently administered trust boundaries. The response controller never treats Kafka event publication as proof that remediation succeeded. OpenID SSF/CAEP may carry risk or revocation signals where supported; they do not by themselves terminate a database connection or cancel a queued business operation.\"}]\u003c/script>\u003cscript>\nconst data=JSON.parse(document.querySelector('#stageData').textContent),$=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));let stage=0,seq=0,step=0,mode='overview',zoom=1,timer=null,enabled=new Set();\nconst names=['Discover and contain','Build a trusted runtime','Authorize scoped operations','Resist and recover'];\nconst inv=[['Evidence has limited reach','Discovery cannot prove every external instance is visible.','An uncontrolled access path remains','Existing user credentials may allow Nova to access systems until the resource owner intervenes.'],['Provider credentials stay outside Nova','The trusted supervisor and gateway mediate approved traffic.','Registration is insufficient','Workload identity is not proof of runtime integrity or authorization for a business action.'],['Two independent decisions','The resource PEP enforces business authority; Vault independently decides credential access.','A lease is not business authorization','Native backend roles and exact request checks are required even after issuance.'],['Containment must be verified','Suspend the mission, revo \nfunction description(label){return glossary.find(([re])=>re.test(label))?.[1]||'Inspect the connected interfaces and enforce the controls at the owning service. This node is part of the illustrative reference deployment.'}\nfunction setStage(i){stop();stage=i;seq=0;step=0;mode='overview';zoom=1;enabled=new Set(stageLayers[i]);const s=data[i];$('stagegrid').innerHTML=data.map((d,j)=>`\u003cbutton class=\"${j===i?'active':''}\" data-stage=\"${j}\">\u003csmall>Stage 0${j}\u003c/small>\u003cstrong>${d.name}\u003c/strong>\u003cspan>${names[j]}\u003c/span>\u003c/button>`).join('');$('stageNum').textContent=`Stage 0${i} / ${s.name}`;$('stageTitle').textContent=s.heading;$('stageIntro').textContent=s.intro;$('metrics').innerHTML=s.metrics.map(m=>`\u003cdiv class=\"metric\">\u003csmall>${safe(m[0])}\u003c/small>\u003cstrong>${safe(m[1])}\u003c/strong>\u003c/div>`).join('');$('archNote').textContent=s.note;$('archSource').textContent=s.source;['invariant','invariantDetail','residual','residualDetail'].forEach((k,j)=>$(k).textContent=inv[i][j]);$('seqSelect').innerHTML=s.sequences.map((q,j)=>`\u003coption value=\"${j}\">${safe(q.title)}\u003c/option>`).join('');$('catalogSearch').value='';renderArch();renderSeq();renderLab();catalog();$('detail').hidden=true;}\nfunction wireNodes(root){root.querySelectorAll('g.node').forEach(g=>{g.setAttribute('tabindex','0');g.setAttribute('role','button');const id=g.id.replace(/^node-/,'');g.addEventListener('click',()=>showDetail(id));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showDetail(id)}})})}\nfunction renderArch(){let s=data[stage];$('overview').classList.toggle('active',mode==='overview');$('full').classList.toggle('active',mode==='full');$('architectureCanvas').innerHTML=s[mode];let svg=$('architectureCanvas').querySelector('svg');svg.style.width=zoom*100+'%';svg.style.maxWidth='none';wireNodes($('architectureCanvas'))}\nfunction showDetail(id){let s=data[stage],label=s.nodes[id]||id;$('de
