<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#151622">
 <meta name="description" content="Follow Alex at home and Nova at a railway company through four stages of AI security.">
 <title>The Agent House · Trust Boundaries</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <header class="topbar">
  <a class="brand" href="#">The Agent House</a>
  <nav aria-label="Main navigation">
   <a class="quiet" href="#">Home</a>
   <a class="quiet" href="#architecture">Architecture</a>
   <button class="quiet" id="reset-game" type="button">Reset</button>
   <button class="quiet" id="language-game" type="button" lang="de" aria-label="Auf Deutsch spielen">DE</button>
  </nav>
 </header>
 <main id="game"></main>
 <dialog id="reset-dialog" aria-labelledby="reset-title" aria-describedby="reset-description">
  <form method="dialog">
   <h2 id="reset-title">Reset progress?</h2>
   <p id="reset-description">This clears saved progress for Alex, Nova and the optional scenarios on this device.</p>
   <div class="actions">
    <button class="secondary" type="submit" value="cancel" autofocus>Cancel</button>
    <button class="primary" type="submit" value="reset">Reset progress</button>
   </div>
  </form>
 </dialog>
 <script src="../assets/people.js"></script>
 <script src="shadow.js"></script>
 <script src="trust-checks.js"></script>
 <script src="nova.js"></script>
 <script src="language.js"></script>
 <script src="de.js"></script>
 <script src="field-guide.js"></script>
 <script src="nova-console.js"></script>
 <script src="nova-ui.js"></script>
 <script src="ui.js"></script>
</body>
</html>
