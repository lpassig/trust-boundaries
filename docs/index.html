<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#151622">
 <meta name="description" content="Follow Alex at home and Nova at a railway company through four stages of AI security.">
 <title>The Agent House · Trust Boundaries</title>
 <style>
:root {
 color-scheme: dark;
 --bg: #151622;
 --panel: #202131;
 --ink: #f3edf9;
 --muted: #c2bacf;
 --line: #4c485e;
 --accent: #c4a5ff;
 --soft: #28243d;
 --green: #b3dbc9;
 --amber: #efd0a0;
 font: 16px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: radial-gradient(ellipse at 15% 0, #30263d, transparent 45rem), var(--bg); min-height: 100vh; }
button, a, select { font: inherit; touch-action: manipulation; }
button { cursor: pointer; color: inherit; background: none; border: 1px solid transparent; }
button:disabled { cursor: default; opacity: .55; }
button:hover:not(:disabled), a.quiet:hover { filter: brightness(1.15); }
a, summary { color: var(--accent); }
summary { cursor: pointer; min-height: 44px; align-content: center; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
[tabindex="-1"]:focus:not(:focus-visible) { outline: none; }

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px max(16px, (100vw - 920px) / 2); border-bottom: 1px solid var(--line); }
.brand { color: var(--ink); font: 600 clamp(17px, 3vw, 24px)/1.2 Georgia, serif; text-decoration: none; }
.topbar nav { display: flex; gap: 4px; }
.quiet { display: inline-flex; align-items: center; min-height: 44px; padding: 6px 10px; text-decoration: none; }
.quiet:hover { text-decoration: underline; }
main { max-width: 952px; margin: auto; padding: clamp(18px, 4vw, 42px) 16px 32px; }
h1, h2, h3, h4, p { margin: 0 0 12px; }
h1 { font: 500 clamp(30px, 5vw, 48px)/1.13 Georgia, serif; margin-block-end: 16px; }
h2 { font: 500 24px/1.2 Georgia, serif; margin-top: 22px; }
h3 { font-size: 18px; }
p, li, dd { color: var(--muted); }
.eyebrow { margin-bottom: 7px; color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: .15em; }
.small-print, .sources { font-size: 14px; margin-block: 14px; overflow-wrap: anywhere; }
.sources a { margin-right: .2em; }

.primary, .secondary, .choice { min-height: 44px; padding: 8px 14px; border-radius: 10px; font-weight: 650; line-height: 1.35; }
.primary { background: var(--accent); border-color: var(--accent); color: #211a31; }
.secondary, .choice { background: var(--panel); border-color: var(--line); color: var(--ink); }
.choice { text-align: left; }
.choice.good { background: var(--soft); border-color: var(--accent); }
.choice small { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; font-weight: 400; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-block: 14px; }
.choices { display: grid; gap: 9px; margin-block: 12px; }
.stage-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stage-list button { padding: 14px; }
.receipt, .debrief, .product-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-block: 10px; background: var(--panel); }
.receipt { border-left: 3px solid var(--green); }
.receipt p:last-child { margin: 4px 0 0; }
.route-list { padding-inline-start: 22px; }
.route-list li + li { margin-top: 6px; }

.architecture-nav, .architecture-path { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.architecture-nav button[aria-pressed="true"], .boundary-edge[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
.architecture-map, .architecture-topology, .product-cards { display: grid; gap: 8px; }
.architecture-group, .architecture-node, .architecture-topology article { padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.architecture-nodes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 8px; }
.architecture-node small, .product-card summary span { display: block; color: var(--muted); font-weight: 400; }
.boundary-graph { padding: 0; list-style: none; }
.boundary-graph li { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 6px; }
.boundary-evidence dt, .architecture-evidence dt, .architecture-threats dt { font-weight: 650; color: var(--accent); }
dd { margin: 0 0 8px; }
select { display: block; width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 10px; }
.architecture-steps { padding-left: 24px; }
.architecture-steps > li { padding-left: 6px; margin-bottom: 12px; }
.product-example { overflow: auto; padding: 10px; background: var(--bg); border-radius: 8px; }
@media (max-width: 560px) {
 .stage-list, .architecture-nodes { grid-template-columns: 1fr; }
 .boundary-graph li { grid-template-columns: minmax(0, 1fr); margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
}

.shadow-rooms{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.shadow-rooms button{flex:1 1 90px;min-height:44px;padding:6px 8px}
.shadow-rooms button[aria-current="location"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.shadow-scene{margin:14px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.shadow-view{position:relative;min-height:125px;overflow:hidden;background:linear-gradient(#443b58 0 72%,#28283c 72%);isolation:isolate}
.shadow-view.living{background:linear-gradient(#344851 0 72%,#26373f 72%)}
.shadow-view.kitchen{background:linear-gradient(#51433d 0 72%,#3a302e 72%)}
.shadow-furniture{position:absolute;bottom:20%;left:8%;width:37%;height:38%;border-radius:9px 9px 2px 2px;background:#a181a1;box-shadow:inset 0 -7px #665570}
.shadow-furniture::before{position:absolute;content:"";bottom:145%;left:8%;width:80%;height:65%;background:repeating-linear-gradient(90deg,#d8bfb3 0 20%,#554761 20% 26%);border:4px solid #796487;border-radius:4px}
.living .shadow-furniture{height:29%;background:#91a99f;box-shadow:inset 0 -7px #587b78}
.living .shadow-furniture::before{left:32%;bottom:110%;width:57%;height:94%;background:#27313e;border-color:#758693}
.kitchen .shadow-furniture{height:45%;border-radius:2px;background:repeating-linear-gradient(90deg,#ae876e 0 28%,#624e47 28% 33%);box-shadow:inset 0 7px #e1c4a8}
.kitchen .shadow-furniture::before{bottom:115%;height:50%;background:repeating-linear-gradient(90deg,#c8a78e 0 28%,#64514b 28% 33%);border-color:#906d59}
.shadow-actors{position:relative;z-index:1;display:flex;justify-content:flex-end;align-items:end;flex-wrap:wrap;gap:4px;padding:12px 8px 5px 28%;min-height:125px}
.shadow-person.choice{display:grid;place-items:center;text-align:center;gap:1px;max-width:145px;min-width:54px;padding:3px 5px;background:#22202de6}
.shadow-person svg{display:block;width:44px;height:78px}
.shadow-person strong{font-size:12px}
.shadow-person small{font-size:11px}
.shadow-person.good{border:2px solid var(--accent)}
.shadow-laptop{width:31px;height:21px;position:absolute;left:27%;bottom:51%;border:3px solid #333244;border-radius:3px;background:#d7cce1;box-shadow:0 4px #aba2bd}
.living .shadow-laptop{bottom:43%}
.shadow-objects{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:6px;padding:9px;background:#202130}
.shadow-objects .choice{display:flex;flex-direction:column;justify-content:center;min-height:50px;padding:7px 9px;overflow-wrap:anywhere}
.shadow-objects .choice strong{font-size:13px}
.shadow-objects .choice.good{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}
.shadow-scene .is-speaking{outline:2px solid var(--amber);outline-offset:-2px}
.shadow-reply{margin:0;padding:8px 12px;border-bottom:1px solid var(--line);border-left:3px solid var(--accent);background:var(--soft)}
.shadow-reply p{margin:3px 0;font-size:14px;line-height:1.45}
.shadow-guide{margin:10px 0;font-size:14px}
.shadow-guide p{margin:0}
.shadow-guide button{margin-top:5px}
.shadow-incident{border-color:var(--amber)}
@media(max-width:560px){
 .shadow-actors{padding-left:8px;justify-content:center}
 .shadow-rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
}
.shadow-view.outside{background:linear-gradient(#a0b3c1 0 59%,#6f8d75 59% 80%,#59606c 80%)}
.outside .shadow-furniture{left:14%;bottom:22%;width:28%;height:58%;border-radius:0;background:#d7baa5;box-shadow:inset 0 -4px #a68b80}
.outside .shadow-furniture::before{background:#735969;border:0;bottom:99%;height:33%;left:-8%;width:116%;clip-path:polygon(50% 0,100% 100%,0 100%)}
.outside .shadow-furniture::after{content:"";position:absolute;bottom:0;left:53%;width:24%;height:56%;background:#80677a;border-radius:3px 3px 0 0}

.room-scenarios,.permission-slip{border-top:1px solid var(--line);margin:0}
.room-scenarios>summary{padding:0 12px}
.permission-slip{border-radius:0;border-inline:0;border-bottom:0}
.permission-slip dl{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.permission-slip dt{font-size:.85rem;color:var(--accent);font-weight:650}
.permission-slip dd{overflow-wrap:anywhere}
.case-location{scroll-margin-top:12px}
.case-view{min-height:80px}
.case-actions .choice{min-height:52px}
@media(max-width:400px){.permission-slip dl{grid-template-columns:1fr}}

.device-launch.choice{position:relative;min-height:66px;padding-left:52px}
.device-launch.good,.device-group .good{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}
.device-icon{position:absolute;left:14px;top:50%;width:19px;height:29px;transform:translateY(-50%);border:2px solid var(--accent);border-radius:5px;background:#30294b}
.device-icon.handset::after{content:"";position:absolute;bottom:3px;left:5px;width:5px;height:2px;border-radius:3px;background:var(--accent)}
.device-icon.laptop{width:26px;height:19px;border-radius:3px 3px 1px 1px}
.device-icon.laptop::after{content:"";position:absolute;left:-5px;right:-5px;bottom:-5px;height:3px;border-radius:0 0 4px 4px;background:var(--accent)}
.device-breadcrumb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-block:12px;color:var(--muted);font-size:14px}
.device-frame{position:relative;margin:14px auto 20px;background:#10111c;border:1px solid #636079;box-shadow:0 12px 22px #07070e66;padding:8px}
.device-frame.handset{max-width:414px;border-radius:32px;padding:18px 9px 12px}
.device-frame.handset::before{content:"";position:absolute;top:7px;left:50%;width:42px;height:4px;transform:translateX(-50%);border-radius:4px;background:#635c78}
.device-frame.laptop{max-width:760px;border-radius:14px 14px 6px 6px;margin-bottom:28px}
.device-frame.laptop::after{content:"";position:absolute;top:100%;left:0;right:0;height:9px;border-radius:0 0 14px 14px;background:#67667b}
.device-display{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#202136}
.handset .device-display{border-radius:20px}
.device-header{padding:14px;background:linear-gradient(130deg,#373055,#252537)}
.laptop .device-header{background:linear-gradient(130deg,#263d47,#282a3b)}
.device-header h2{margin:0 0 5px;font-size:24px}
.device-header p{margin:0;font-size:13px}
.device-group{padding-top:8px;border-top:1px solid var(--line)}
.device-group h3{font-size:13px;font-weight:650;line-height:1.3;margin:0 10px 3px;color:var(--muted)}
.device-group .shadow-objects{background:transparent}
.device-display .shadow-reply{border-bottom:0}
.device-display .is-speaking{outline:2px solid var(--amber);outline-offset:-2px}
@media(max-width:360px){.device-frame.handset{padding-inline:6px}.device-display .shadow-objects{grid-template-columns:minmax(0,1fr)}}

.nova-scene{margin:14px 0;border:1px solid #4c626d;border-radius:14px;overflow:hidden;background:#18232d}
.nova-location{padding:22px 16px 14px;background:repeating-linear-gradient(90deg,#26394655 0 28px,transparent 28px 32px),linear-gradient(135deg,#273d4c,#202b3a)}
.nova-scene.resources .nova-location{background:linear-gradient(135deg,#334c5b,#20303c)}
.nova-scene.security .nova-location{background:linear-gradient(135deg,#323c5b,#232638)}
.nova-scene.external .nova-location{background:linear-gradient(135deg,#394753,#222c39)}
.nova-location h2{margin:0 0 6px}
.nova-location p,.nova-next p{margin:0}
.nova-next,.nova-actions{padding:10px 12px}
.nova-next button{margin-top:6px}
.nova-scene .shadow-objects{background:#17212c}
.nova-scene .shadow-objects .choice{justify-content:flex-start}

</style>
</head>
<body>
 <header class="topbar">
  <a class="brand" href="#">The Agent House</a>
  <nav aria-label="Main navigation">
   <a class="quiet" href="#">Stages</a>
   <a class="quiet" href="#architecture">Architecture</a>
  </nav>
 </header>
 <main id="game"></main>
 <script>
// Original vector scenery. No remote assets or network dependencies.
// All figures use their shoe soles as the origin, so placement is on the floor.
function humanFigure(role,x,y,scale=1) {
  const adult=!['alex','sibling','mia'].includes(role);
  const colors={parent:{skin:'#d8b19b',hair:'#584651',shirt:'#8c9b98',shade:'#748781',pants:'#424857',shoe:'#d6c5b6'},
   grandparent:{skin:'#d8b19b',hair:'#b8aeb3',shirt:'#779498',shade:'#5a777b',pants:'#424857',shoe:'#d6c5b6'},
   grandparentTwo:{skin:'#cba48d',hair:'#cdc2ba',shirt:'#ba9476',shade:'#997857',pants:'#424857',shoe:'#d6c5b6'},
   parentTwo:{skin:'#cba48d',hair:'#473842',shirt:'#9c8396',shade:'#806876',pants:'#424857',shoe:'#d6c5b6'},
   alex:{skin:'#dfb39d',hair:'#3e3448',shirt:'#b39ace',shade:'#937aaf',pants:'#53617e',shoe:'#e4ddec'},sibling:{skin:'#cba48d',hair:'#635049',shirt:'#8da9b1',shade:'#708e9d',pants:'#444e64',shoe:'#cbd8dc'},
   babysitter:{skin:'#a57961',hair:'#333147',shirt:'#5f9d94',shade:'#47786f',pants:'#3a434f',shoe:'#e0d1bd'},
   mia:{skin:'#dfb39d',hair:'#59405c',shirt:'#dca184',shade:'#aa6b68',pants:'#574762',shoe:'#e8d8d1'}}[role];
  return `<g class="human-figure" data-character="${role}" data-floor-x="${x}" data-floor-y="${y}" transform="translate(${x} ${y}) scale(${scale})">
    <ellipse class="contact-shadow" cx="2" cy="2" rx="29" ry="7" fill="#171728" opacity=".28"/>
    <path d="M-18-73L18-73L20-37L18-5L7-4L2-46L-3-46L-9-4L-21-5L-20-38Z" fill="${colors.pants}"/>
    <path d="M-1-68L1-47M-17-35L-12-34M8-35L17-34" stroke="#2f374c" stroke-width="1.4" opacity=".45" fill="none"/>
    <path d="M-21-7L-9-7L-4-2Q2 1-3 4L-25 3Q-28 0-21-7Z" fill="${colors.shoe}"/>
    <path d="M7-7L18-7L24-3Q33 1 28 4L6 3Z" fill="${colors.shoe}"/>
    ${adult?'':`<path d="M-22 1L-4 2M9 1L27 2M-15-4L-10-3M14-4L19-3" stroke="#a5a4b7" stroke-width="1"/>`}
    <path d="M-19-123Q-30-119-30-103L-27-78L-18-77L-18-100L-11-114Z" fill="${colors.shade}"/>
    <path d="${adult?'M18-122Q34-114 34-103L28-90L19-94L23-104L10-114Z':'M18-122Q29-118 29-101L27-76L18-77L17-100L10-113Z'}" fill="${colors.shade}"/>
    <ellipse cx="-22" cy="-74" rx="4.7" ry="6.5" fill="${colors.skin}"/>
    <ellipse cx="${adult?25:22}" cy="${adult?-89:-73}" rx="4.7" ry="6.5" transform="${adult?'rotate(24 25 -89)':''}" fill="${colors.skin}"/>
    <path d="M-18-124Q-7-131 5-129L19-123L23-76Q5-66-22-74L-21-104Z" fill="${colors.shirt}"/>
    <path d="M14-120L19-115L21-77L10-74Z" fill="${colors.shade}" opacity=".55"/>
    <path d="M-5-138L6-138L7-125Q0-118-7-126Z" fill="${colors.skin}"/>
    ${adult?`<path d="M-9-128L-1-116L8-128L10-76L-10-75Z" fill="#e7dccb"/><path d="M-9-128L-3-116L-11-106M8-128L2-116L10-106" fill="none" stroke="#647a75" stroke-width="1.6"/><circle cx="-2" cy="-101" r="1.5" fill="#8c837b"/><circle cx="-2" cy="-89" r="1.5" fill="#8c837b"/>`:`<path d="M-11-127Q0-117 10-127L13-119Q0-110-13-119Z" fill="${colors.shade}"/><path d="M-7-117L-8-100M7-117L8-100" stroke="#e2d6eb" stroke-width="1.4"/><path d="M-13-91Q0-96 13-89L14-80L-14-80Z" fill="${colors.shade}" opacity=".75"/>`}
    <g class="character-head">
      ${adult?`<path d="M-16-151Q-21-178 0-180Q23-177 19-149L16-132L-16-134Z" fill="${colors.hair}"/>`:''}
      <ellipse cx="-13" cy="-151" rx="3.8" ry="5.4" fill="${colors.skin}"/><ellipse cx="14" cy="-151" rx="3.5" ry="5.2" fill="${colors.skin}"/>
      <path d="M-13-158Q-13-173 1-173Q17-172 15-156L14-145Q10-133 1-133Q-9-134-12-145Z" fill="${colors.skin}"/>
      <path d="${adult?'M-15-153Q-20-176-2-179Q17-183 18-160L12-153L9-168Q-1-157-14-159Z':'M-15-152L-18-164L-13-164Q-13-178-3-176Q7-186 13-176Q24-172 18-157L12-152L9-164Q0-156-10-160L-12-151Z'}" fill="${colors.hair}"/>
      <path d="M-8-152L-4-153M5-153L9-152" stroke="#69515b" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="-5" cy="-149" r="1.2" fill="#3e3546"/><circle cx="7" cy="-149" r="1.2" fill="#3e3546"/>
      <path d="M2-148L4-143L1-142M-3-139Q1-136 6-140" fill="none" stroke="#a27373" stroke-width="1.1" stroke-linecap="round"/>
      ${adult?'<g fill="none" stroke="#6c646d" stroke-width="1"><rect x="-10" y="-152" width="9" height="7" rx="2.5"/><rect x="3" y="-152" width="9" height="7" rx="2.5"/><path d="M-1-150L3-150"/></g>':''}
    </g>
  </g>`;
}

</script>
 <script>
/* Primary-source review: 2026-11-23. Optional integrations are not native-product claims. */
const PROTOCOL_SOURCES = {

 mcpClientRegistration:{name:'MCP Client Registration — 2026-07-28',url:'https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization/client-registration'},
 openshell:{name:'NVIDIA OpenShell architecture',url:'https://docs.nvidia.com/openshell/about/architecture'},
 vault:{name:'Vault Agentic IAM',url:'https://developer.hashicorp.com/vault/ai/iam'},
 verifyExchange:{name:'IBM Verify token exchange',url:'https://docs.verify.ibm.com/verify/docs/token-exchange'},
 vaultVerify:{name:'Configure IBM Verify for Vault Agentic IAM',url:'https://developer.hashicorp.com/vault/ai/iam/providers/verify'},
 vaultOAuth:{name:'Vault as an OAuth resource server',url:'https://developer.hashicorp.com/vault/ai/iam/concepts/oauth-profiles'},
 vaultJwtLogin:{name:'Vault JWT/OIDC login',url:'https://developer.hashicorp.com/vault/docs/auth/jwt'},
 vaultOptionalRar:{name:'Vault RAR-optional migration configuration',url:'https://developer.hashicorp.com/vault/ai/iam/make-rar-optional'},

 const ticketRequest={operation:'createMaintenanceTicket',asset:'RE-204',priority:'High',team:'Railway Maintenance',operationId:'OP-204-TICKET-1'};
 function ticketDecision(s,request=ticketRequest){
  if(s.stage!=='resist'||s.incident||reached(s,'close'))return 'Mission unavailable';
  const fields=Object.keys(ticketRequest);
  if(Object.keys(request).length!==fields.length||fields.some(field=>request[field]!==ticketRequest[field]))return 'Outside approved operation';

 }

 const normalNext=s=>stages[s.stage].steps[s.index];

   if(id==='timeout-resource'&&current.id==='ack-resource'&&s.room===current.room){

   }
   if(current.room!==s.room||current.id!==id)return s;

   }
   if(id==='investigate'){

    return {...result,incident:{...s.incident,reviewed:true}};
   }
   const renewed={...s,version:s.version+1,generation:s.generation+1};
   const result=record(renewed,id,'Mission and admission services','A fresh workload and posture check passes. The owner reauthorizes the previously allowed scope under a new version. Old permits and leases stay closed.','Reauthorized');
   return {...result,risk:0,activeChecks:[],incident:null,permit:null};
  }
  if(current?.room===s.room&&current.id===id){
   if(id==='permit'&&ticketDecision(s)!=='Permit')return s;
   if(id==='commit'&&(s.permit!==s.version||ticketDecision(s)!=='Permit'))return s;
   const state=id==='grant'?{...s,version:s.version+1}:s;
   const result=record(state,id,stations[current.station][0],current.reply,id==='commit'?'Committed':'Recorded');
   return {...result,index:s.index+1,credentialVersion:id==='ticketCredential'?s.version:s.credentialVersion,
    permit:id==='permit'?s.version:s.permit,ticket:id==='commit'?'MT-204':s.ticket};
  }
  const item=available(s).find(entry=>entry.id===id);
  if(!item)return s;
  const points=s.activeChecks.includes(id)?0:item.points;
  const result=record(s,id,item.owner,item.reply,id==='duplicate'?'Prior receipt':'Control checked',points);
  const risk=s.risk+points;
  if(risk<4)return {...result,risk,activeChecks:[...new Set([...s.activeChecks,id])]};

  const index=(!s.ticket&&reached(s,'ticketCredential'))?stages.resist.steps.findIndex(item=>item.id==='ticketCredential'):s.index;

 }
 function restore(stage,value){
  if(value?.stage!==stage||!Array.isArray(value.events))return fresh(stage);

   const room=event?.id==='timeout-resource'?'resources':next(state)?.id===event?.id?next(state).room:
    checks[stage].find(item=>item.id===event?.id)?.room;

  }

 }

  if(s.stage==='unknown'||!reached(s,s.stage==='build'?'scope':'register'))return null;
  const resource=['authorize','resist'].includes(s.stage);

   id:resource?'M-204':'M-101',
   status:s.incident?'Suspended':reached(s,'close')?'Closed':'Active',

   memory:resource?'M-204 isolated workspace':'M-101 isolated workspace'

 }
 return {scenes,stages,stations,checks,controllers,ticketRequest,ticketDecision,fresh,visit,reached,next,complete,available,act,restore,mission};
})();

 };

 };

 }[reply?.[0]];

   ${!step&&chapter>=2?button('Explore the technical reference',()=>navigate('architecture'),'secondary'):''}
   ${!step?button('Compare with Nova at this stage',()=>navigate(novaStageRoute(stage)),'secondary'):''}
   ${index?button(`Replay Stage ${chapter}`,()=>set(ShadowStory.fresh(stage)),'secondary'):''}${button('All stages',()=>navigate(''),'secondary')}</div>`, `${data.tag} · ALEX`);
 $$('[data-shadow-room]').forEach(control=>control.onclick=()=>{
  set(ShadowStory.visit(state,control.dataset.shadowRoom));
  $('[data-shadow-room][aria-current]')?.focus({preventScroll:true});
 });
}

const stageRoutes={unknown:'shadow',build:'build',authorize:'authorize',resist:'resist'};
const stageIntroductions={
 unknown:'Find out what happens when a hidden phone and an open bank session go unnoticed.',
 build:'Research the solar system with a school assignment and a managed phone.',
 authorize:'Find a better source and get read-only access to one folder.',
 resist:'Work with Jo and Mia, then see which controls respond when someone crosses a boundary.'
};
function showIntro(){
 const current=Object.keys(household).find(stage=>!ShadowStory.complete(household[stage]));
 const started=Object.values(household).some(state=>state.index>0);
 showScreen('The Agent House',`
  <p>Help Alex complete assignments as he earns more independence. Each stage returns to the same four rooms and gives you new ways to test who can grant access, what enforces it, and when it ends.</p>
  <div class="actions">${current?button(started?'Continue Alex':'Play Alex',()=>navigate(stageRoutes[current])):''}
   ${button('Play Nova’s technical journey',()=>navigate('nova'),'secondary')}</div>
  <h2>Choose a stage</h2>
  <div class="stage-list choices">${Object.entries(ShadowStory.stages).map(([stage,data])=>{
   const status=ShadowStory.complete(household[stage])?' · Completed':household[stage].index?' · In progress':'';
   return button(data.title,()=>navigate(stageRoutes[stage]),'choice',data.tag+status+' · '+stageIntroductions[stage]);
  }).join('')}</div>
  <p class="small-print">Select the highlighted action to advance. Open a phone or laptop to use its apps, browser and files. From Stage 1, open <b>Optional security scenarios</b> to test a control. ${stored?'Progress is saved on this device.':'Progress is kept for this visit.'}</p>`,
  'TRUST BOUNDARIES');
}
function renderRoute(){
 const route=location.hash.slice(1);
 const stage=Object.keys(stageRoutes).find(key=>stageRoutes[key]===route);
 const novaStage=Object.keys(NovaRailway.stages).find(key=>novaStageRoute(key)===route);
 if(stage)showHousehold(stage);
 else if(novaStage)showNova(novaStage);
 else if(route==='nova')showNovaIntro();
 else if(route==='architecture')showArchitecture();
 else showIntro();
 $('#screen-title').focus({preventScroll:true});
 window.scrollTo(0,0);
}
function navigate(route){
 if(route!==location.hash.slice(1))history.pushState(null,'','#'+route);
 renderRoute();
}
$$('.topbar a').forEach(link=>link.onclick=event=>{
 if(event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;
 event.preventDefault();
 navigate(link.hash.slice(1));
});
window.addEventListener('hashchange',renderRoute);
renderRoute();

</script>
</body>
</html>
